<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Роль — iTeal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@500;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/d3@7"></script>
<style>
:root{
  --it-teal:#43836D; --it-teal-deep:#2C5748; --it-mint:#7AC1A8; --it-accent:#FFD54F;
  --it-ink:#1C2622; --it-ink-soft:#3B4742; --it-grey:#6B7A75; --it-grey-light:#8C9994;
  --it-line:#E4EAE7; --it-paper:#F5F8F6; --it-white:#fff;
  --radius-sm:4px; --radius-md:8px;
  --shadow-sm:0 1px 2px rgba(28,38,34,.06);
  --shadow-md:0 2px 8px rgba(28,38,34,.08);
  --font-heading:'Ubuntu','Verdana',sans-serif;
  --font-body:'Open Sans','Arial',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--it-paper);color:var(--it-ink-soft);font-family:var(--font-body);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;padding:0 24px 96px}
img{display:block}
a{color:var(--it-teal)}
:focus-visible{outline:2px solid var(--it-teal);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
.layout{display:flex;gap:24px;align-items:flex-start}
.layout[hidden]{display:none}
.card{flex:1;min-width:0;max-width:820px}
.minimap-panel{flex:0 0 300px;min-width:0;position:sticky;top:96px}
.minimap-panel .stage{background:var(--it-white);border:1px solid var(--it-line);border-radius:var(--radius-md);
  padding:10px;box-shadow:var(--shadow-sm)}
.minimap-panel svg{display:block;width:100%;height:auto}
.node-circle{cursor:pointer}
.node-circle.root{fill:rgba(44,87,72,.03);stroke:var(--it-teal-deep);stroke-width:2}
.node-circle.container{fill:rgba(67,131,109,.08);stroke:var(--it-teal);stroke-width:1.3}
.node-circle.leaf-filled{fill:var(--it-teal);stroke:var(--it-teal-deep);stroke-width:1.3}
.node-circle.leaf-empty{fill:var(--it-white);stroke:var(--it-mint);stroke-width:1.3}
.node-circle.current{stroke:var(--it-accent);stroke-width:3}
.node-label{font-family:var(--font-heading);font-weight:700;fill:var(--it-ink-soft);
  text-anchor:middle;pointer-events:none;user-select:none}
.node-label.on-fill{fill:#fff}
.node-label.container{fill:var(--it-teal-deep)}
.siblings{margin-top:16px;background:var(--it-white);border:1px solid var(--it-line);border-radius:var(--radius-md);
  padding:14px;box-shadow:var(--shadow-sm)}
.siblings h3{font:700 12px var(--font-heading);text-transform:uppercase;letter-spacing:.06em;color:var(--it-grey);margin:0 0 8px}
.siblings a{display:block;padding:6px 8px;border-radius:6px;text-decoration:none;color:var(--it-ink-soft);font-size:14px}
.siblings a:hover{background:var(--it-paper)}
.siblings a.current{font-weight:700;color:var(--it-teal-deep);background:var(--it-paper)}
@media (max-width:900px){
  .layout{flex-direction:column}
  .minimap-panel{flex-basis:auto;width:100%;position:static}
}

.it-header{position:sticky;top:0;z-index:10;background:var(--it-white);padding:16px 0;
  margin:0 0 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{height:60px;width:auto;margin:0}
.it-nav{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.it-nav a{display:inline-flex;align-items:center;padding:10px 16px;border-radius:999px;
  background:#E3F1EC;color:#3B4742;font-family:var(--font-heading);font-weight:700;font-size:14px;
  text-decoration:none;transition:background-color .14s ease-out}
.it-nav a:hover{background:#D3E9E0}

.it-totop{position:fixed;right:22px;bottom:30px;z-index:45;width:46px;height:46px;border-radius:50%;
  border:none;background:#2C5748;color:#F5F8F6;font-size:19px;font-weight:700;
  cursor:pointer;box-shadow:0 6px 18px rgba(28,38,34,.25);display:flex;align-items:center;justify-content:center}
.it-totop:hover{background:#233F35}
@media print{.it-totop{display:none}}

.status{color:var(--it-grey);font-size:14px}
.status.err{color:#93372C}

/* карточка роли */
.card{margin-top:8px}
.kicker{font-size:13px;text-transform:uppercase;letter-spacing:.2em;font-weight:700;color:var(--it-teal);margin:0}
h1{font-family:var(--font-heading);font-weight:700;font-size:40px;line-height:1.15;color:var(--it-ink);margin:8px 0 0}
.h1input{font-family:var(--font-heading);font-weight:700;font-size:40px;line-height:1.15;color:var(--it-ink);
  margin:8px 0 0;border:none;background:transparent;width:100%;padding:2px 0}
.h1input:focus{outline:none;border-bottom:2px solid var(--it-mint)}
.rule{height:4px;width:100%;background:var(--it-accent);border-radius:var(--radius-sm);margin:16px 0 0}
.hero{margin:32px 0 0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm)}
.hero img{display:block;width:100%;height:auto}

.assignees{margin:20px 0 0;font-size:14.5px;color:var(--it-ink-soft)}
.assignees b{color:var(--it-ink)}
.leadersel{display:block;margin-top:6px;max-width:280px;width:100%;font:400 14px/1.5 var(--font-body);
  color:var(--it-ink);background:var(--it-white);border:1px solid var(--it-line);border-radius:var(--radius-sm);padding:8px 10px}
.leadersel:focus{outline:none;border-color:var(--it-teal)}
.taglist{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--it-white);border:1px solid var(--it-line);
  border-radius:999px;padding:5px 8px 5px 14px;font-size:14px;box-shadow:var(--shadow-sm)}
.tag input{border:none;background:transparent;font:inherit;color:var(--it-ink);width:auto;min-width:70px;padding:0}
.tag input:focus{outline:none}
.tagdel{flex:none;width:20px;height:20px;border:none;background:var(--it-paper);border-radius:50%;
  color:var(--it-grey);cursor:pointer;font-size:13px;line-height:1;padding:0}
.tagadd{font:600 13px var(--font-body);color:var(--it-teal);background:none;border:1px dashed var(--it-mint);
  border-radius:999px;padding:6px 14px;cursor:pointer}
.tagadd:hover{background:rgba(122,193,168,.1)}

/* вкладки */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--it-line);margin-top:32px;flex-wrap:wrap}
.tab{font:600 14px var(--font-body);color:var(--it-grey);background:none;border:none;
  padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--it-teal-deep)}
.tab.on{color:var(--it-teal-deep);border-bottom-color:var(--it-teal)}
.tabpanel{display:none;padding-top:28px}
.tabpanel.on{display:block}

.kicker.mb{margin-bottom:24px;display:block}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:16px;align-items:flex-start;background:var(--it-white);border:1px solid var(--it-line);
  border-radius:var(--radius-md);padding:16px;box-shadow:var(--shadow-sm)}
.item .n{flex:none;width:32px;height:32px;border-radius:var(--radius-sm);background:var(--it-paper);
  display:grid;place-items:center;font-family:var(--font-heading);font-weight:700;font-size:14px;color:var(--it-teal)}
.item .txt{flex:1;min-width:0;padding-top:4px}
.item .txt p{margin:0;font-size:16px;color:var(--it-ink)}
.item .txt.editable{font-size:16px;color:var(--it-ink)}
.item .itemdel{flex:none;width:26px;height:26px;border:1px solid var(--it-line);background:var(--it-white);
  border-radius:50%;color:var(--it-grey);cursor:pointer;font-size:15px;line-height:1;padding:0;margin-top:3px}
.item .itemdel:hover{border-color:#B4483C;color:#93372C}
.listadd{margin-top:12px;align-self:flex-start;font:600 13px var(--font-body);color:var(--it-teal);
  background:none;border:1px dashed var(--it-mint);border-radius:var(--radius-md);padding:10px 16px;cursor:pointer}
.listadd:hover{background:rgba(122,193,168,.1)}
.empty-hint{font-size:14px;color:var(--it-grey-light)}

/* rich text */
.rtbar{display:flex;gap:4px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.rtbar button{width:30px;height:30px;border:1px solid var(--it-line);background:var(--it-white);
  border-radius:6px;cursor:pointer;font:600 13px var(--font-body);color:var(--it-ink-soft)}
.rtbar button:hover{background:var(--it-paper)}
.rtbar input[type=color]{width:30px;height:30px;border:1px solid var(--it-line);border-radius:6px;
  padding:2px;background:var(--it-white);cursor:pointer}
.rtbar.on-teal button{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.4)}
.rtbar.on-teal button:hover{background:rgba(255,255,255,.24)}
.rte{min-height:1.6em;height:auto;border:1px solid var(--it-line);border-radius:var(--radius-sm);padding:10px 12px;
  font:400 15px/1.5 var(--font-body);color:var(--it-ink);background:var(--it-white)}
.rte:focus{outline:none;border-color:var(--it-teal)}
.rte.on-teal{color:#fff;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.3);
  font-family:var(--font-heading);font-weight:500;font-size:20px;line-height:1.3}
.rte-view{font-size:16px;color:var(--it-ink)}
.editable ul,.editable ol,.rte-view ul,.rte-view ol{padding-left:24px;margin:6px 0}
.editable ul ul,.editable ol ol,.editable ul ol,.editable ol ul,
.rte-view ul ul,.rte-view ol ol,.rte-view ul ol,.rte-view ol ul{padding-left:20px;margin:2px 0}
.editable li,.rte-view li{margin:2px 0}
.mission{background:var(--it-teal);border-radius:var(--radius-md);padding:20px 24px}
.mission .kicker{color:var(--it-white);opacity:.85}
.mission .rte-view{font-family:var(--font-heading);font-weight:500;font-size:22px;line-height:1.25;
  color:var(--it-white);margin-top:12px}
.mission .rte-view a{color:#fff;text-decoration:underline}

/* чек-лист */
.citem{display:flex;align-items:center;gap:10px;background:var(--it-white);border:1px solid var(--it-line);
  border-radius:var(--radius-md);padding:12px 14px;box-shadow:var(--shadow-sm)}
.citem input[type=checkbox]{width:18px;height:18px;flex:none;accent-color:var(--it-teal)}
.citem .ctext{flex:1;font-size:15px;color:var(--it-ink);border:none;background:transparent;font-family:inherit}
.citem .ctext:focus{outline:none}
.citem.done .ctext{text-decoration:line-through;color:var(--it-grey)}

/* вложения */
.attrow{display:flex;gap:8px;align-items:center;background:var(--it-white);border:1px solid var(--it-line);
  border-radius:var(--radius-md);padding:10px 12px;box-shadow:var(--shadow-sm)}
.attrow .attname{flex:0 0 40%;border:none;background:transparent;font:600 14px var(--font-body);color:var(--it-ink);min-width:0}
.attrow .atturl{flex:1;border:none;background:transparent;font:14px var(--font-body);color:var(--it-ink-soft);min-width:0}
.attrow input:focus{outline:none}
.attaddrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.attaddrow input{flex:1;min-width:140px;font:400 14px var(--font-body);border:1px solid var(--it-line);
  border-radius:8px;padding:8px 10px}
.attview{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--it-line)}
.attview:last-child{border-bottom:none}
.attview img{max-width:96px;max-height:72px;border-radius:6px;object-fit:cover;flex:none}
.attview a{font-weight:600}

.hist{color:var(--it-grey);font-size:14.5px}
.hist .note{margin-top:8px;font-size:12.5px;color:var(--it-grey-light)}

.notes-wrap{display:flex;flex-direction:column;gap:28px}

.editable{outline:none;cursor:text}
.editable:focus{background:rgba(122,193,168,.08);border-radius:4px}
.rte.editable:focus{background:var(--it-white)}
.rte.on-teal.editable:focus{background:rgba(255,255,255,.08)}
.item .txt.editable{min-height:1.4em}
.citem .ctext.editable{min-height:1.3em;padding:2px 0}

.rtbar.floating{position:sticky;top:96px;z-index:9;background:var(--it-white);border:1px solid var(--it-line);
  border-radius:10px;box-shadow:var(--shadow-md);padding:6px 8px;margin:16px 0 0;display:none;width:max-content}
.rtbar.floating.show{display:flex}
.rtbar.floating.on-teal{background:var(--it-teal-deep)}

.histlist{display:flex;flex-direction:column;gap:10px}
.histrow{background:var(--it-white);border:1px solid var(--it-line);border-radius:var(--radius-md);
  padding:12px 14px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:2px}
.histrow b{color:var(--it-ink);font-size:14.5px}
.histrow span{color:var(--it-grey);font-size:12.5px}

.titlebar{display:flex;align-items:center;gap:10px}
.pencil-btn{width:28px;height:28px;border:1px solid var(--it-line);background:var(--it-white);
  border-radius:8px;cursor:pointer;font-size:13px;color:var(--it-teal);display:inline-flex;
  align-items:center;justify-content:center;padding:0}
.pencil-btn:hover{background:var(--it-paper);border-color:var(--it-teal)}
.pencilwrap{position:relative}
.pencilmenu{position:absolute;top:34px;left:0;background:var(--it-white);border:1px solid var(--it-line);
  border-radius:10px;box-shadow:var(--shadow-md);padding:6px;flex-direction:column;
  min-width:150px;z-index:20;display:none}
.pencilmenu.show{display:flex}
.pencilmenu button{font:500 14px var(--font-body);color:var(--it-ink-soft);background:none;border:none;
  text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer}
.pencilmenu button:hover{background:var(--it-paper)}
.pencilmenu button[data-action="delete"]{color:#93372C}
.pencilmenu button[data-action="delete"]:hover{background:#FDF7F6}
.btn{font:600 14px var(--font-body);border:1px solid var(--it-teal);background:var(--it-white);
  color:var(--it-teal);border-radius:var(--radius-sm);padding:10px 18px;cursor:pointer}
.btn:hover{background:rgba(122,193,168,.1)}
.btn.pri{background:var(--it-teal);color:#fff;border-color:var(--it-teal)}
.btn.pri:hover{background:var(--it-teal-deep)}
.btn:disabled{opacity:.6;cursor:default}
.savebar{position:sticky;bottom:16px;display:flex;gap:10px;margin-top:36px;padding:14px 18px;
  background:var(--it-white);border:1px solid var(--it-line);border-radius:var(--radius-md);
  box-shadow:var(--shadow-md)}



footer{margin:48px 0 0;padding-top:16px;border-top:1px solid var(--it-line);font-size:13px;color:var(--it-grey)}

@media (max-width:640px){
  h1,.h1input{font-size:30px}
  .mission{padding:16px 20px}
}
</style>
</head>

     просмотр, даже для админа. Карандашик над названием включает
     редактирование; "Сохранить" разом отправляет все поля и возвращает
     обратно в просмотр (кнопки "+"/удалить и т.д. в просмотре не видны). */
  var EDITING = false;

  var $ = function (s) { return document.querySelector(s); };
  function эк(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function sanitizeHtml_(html) {
    var el = document.createElement("div");
    el.innerHTML = String(html || "");
    el.querySelectorAll("script,iframe,object,embed,style,link").forEach(function (n) { n.remove(); });
    el.querySelectorAll("*").forEach(function (n) {
      Array.prototype.slice.call(n.attributes).forEach(function (a) {
        if (/^on/i.test(a.name) || (a.name === "href" && /^\s*javascript:/i.test(a.value))) n.removeAttribute(a.name);
      });
    });
    return el.innerHTML;
  }

  function plainText_(html) {
    var el = document.createElement("div");
    el.innerHTML = String(html || "");
    return (el.textContent || "").trim();
  }

  function jsonp(params, ok, err, ms) {
    if (!SEND_URL) { err("адрес /exec ещё не вписан в SEND_URL"); return; }
    var name = "__iteal_role_" + Date.now() + "_" + Math.floor(Math.random() * 1e6);
    var sc = document.createElement("script");
    var done = false;
    var tm = setTimeout(function () { fin(err, "нет ответа"); }, ms || 12000);
    function fin(fn, arg) {
      if (done) return; done = true; clearTimeout(tm);
      try { delete window[name]; } catch (e) { window[name] = undefined; }
      sc.remove(); if (fn) fn(arg);
    }
    window[name] = function (data) { fin(ok, data); };
    sc.onerror = function () { fin(err, "нет доступа к адресу"); };
    var qs = "callback=" + name;
    Object.keys(params || {}).forEach(function (k) { qs += "&" + k + "=" + encodeURIComponent(params[k]); });
    sc.src = SEND_URL + (SEND_URL.indexOf("?") < 0 ? "?" : "&") + qs + "&t=" + Date.now();
    document.head.appendChild(sc);
  }

  function orgAction(kind, payload, onDone) {
    payload = payload || {};
    payload.mail = ТЕКУЩАЯ_ПОЧТА;
    jsonp({ action: kind, payload: JSON.stringify(payload) }, function (res) {
      if (!res || res.ok === false) { onDone(false, (res && res.error) || "нет ответа"); return; }
      if (res._action !== undefined && res._action !== kind) {
        onDone(false, "сервер не выполнил «" + kind + "» — похоже, развёрнута старая версия Маршрутные-карты.gs");
        return;
      }
      onDone(true, res);
    }, function (why) { onDone(false, why); }, 15000);
  }

  function load() {
    if (!ID) {
      $("#status").textContent = "Не указана роль (нет id в ссылке).";
      $("#status").className = "status err";
      return;
    }
    jsonp({ action: "orgList" }, function (res) {
      if (!res || res.ok === false) {
        $("#status").textContent = "Не получилось загрузить данные: " + ((res && res.error) || "нет ответа") + ".";
        $("#status").className = "status err";
        return;
      }
      var node = (res.nodes || []).filter(function (n) { return n.id === ID; })[0];
      if (!node) {
        $("#status").textContent = "Роль с таким адресом не найдена — возможно, её удалили.";
        $("#status").className = "status err";
        return;
      }
      CURRENT = node;
      buildIndex_(res.nodes || []);
      $("#status").hidden = true;
      $("#layout").hidden = false;
      buildCard_(CURRENT);
      buildMinimap_();
      buildSiblings_();
    }, function (why) {
      $("#status").textContent = "Нет связи с сервером: " + why + ".";
      $("#status").className = "status err";
    }, 15000);
  }

  /* Одно сохранение разом — по кнопке "Сохранить", а не на каждый blur.
     Собирает всё, что сейчас есть в DOM (режим редактирования держит все
     вкладки в DOM одновременно, просто скрытые — так что читать поля можно
     независимо от того, какая вкладка сейчас открыта). */
  /* Важно: в payload идут ТОЛЬКО поля, которые реально редактируются на
     этой странице — ни в коем случае не весь CURRENT целиком. CURRENT
     содержит ещё и history (до 50 записей) и, в будущем, photo — если
     механически заспредить их в каждый запрос на сохранение, адрес /exec
     разрастается до такой длины, что браузер отказывается его открывать
     ("нет доступа к адресу"), даже если на вид роль почти пустая. */
  function saveAll_(cb) {
    var payload = {
      id: ID,
      changeLabel: "Изменено",
      name: $("#fName").value.trim(),
      purpose: sanitizeHtml_(document.querySelector('[data-field="purpose"]').innerHTML),
      notes: sanitizeHtml_(document.querySelector('[data-field="notes"]').innerHTML),
      domains: gatherList_("domains"),
      accountabilities: gatherList_("accountabilities"),
      policies: gatherList_("policies"),
      projects: gatherList_("projects"),
      goals: gatherList_("goals"),
      metrics: gatherList_("metrics"),
      assignees: isCircleId_(ID) ? gatherLeader_() : gatherTags_("assignees"),
      checklist: gatherChecklist_(),
      attachments: gatherAttachments_()
    };
    orgAction("orgUpdateFields", payload, function (ok, resOrWhy) {
      if (ok) {
        CURRENT = Object.assign({}, CURRENT, payload);
        CURRENT.updatedAt = new Date().toLocaleString("ru-RU");
        CURRENT.updatedBy = ТЕКУЩАЯ_ПОЧТА;
        CURRENT.history = (CURRENT.history || []).concat([
          [new Date().toISOString(), ТЕКУЩАЯ_ПОЧТА, "Изменено"].join(РАЗД)
        ]);
      } else {
        alert("Не сохранилось: " + resOrWhy);
      }
      if (cb) cb(ok, resOrWhy);
    });
  }

  /* ------------------------------  общий плавающий тулбар  ----------------- */
  /* Один тулбар на всю страницу вместо отдельного под каждым полем —
     появляется рядом с любым полем, куда встал курсор (.editable), и
     форматирует именно его. mousedown на кнопках — всегда preventDefault,
     иначе клик по кнопке сам уводит фокус с поля раньше, чем успевает
     сработать форматирование. */

  var ACTIVE_EDITABLE = null;
  var SAVED_RANGE = null;

  function floatBarHtml_() {
    return '<div class="rtbar floating" id="floatBar">' +
      '<button type="button" data-cmd="bold" title="Жирный"><b>Ж</b></button>' +
      '<button type="button" data-cmd="italic" title="Курсив"><i>К</i></button>' +
      '<button type="button" data-cmd="insertUnorderedList" title="Маркированный список">☰•</button>' +
      '<button type="button" data-cmd="insertOrderedList" title="Нумерованный список">☰1</button>' +
      '<button type="button" data-cmd="outdent" title="Уменьшить уровень списка">⇤¶</button>' +
      '<button type="button" data-cmd="indent" title="Увеличить уровень списка (вложенность)">⇥¶</button>' +
      '<button type="button" data-cmd="justifyLeft" title="По левому краю">⇤</button>' +
      '<button type="button" data-cmd="justifyCenter" title="По центру">⇔</button>' +
      '<button type="button" data-cmd="justifyRight" title="По правому краю">⇥</button>' +
      '<button type="button" data-cmd="justifyFull" title="По ширине">☰</button>' +
      '<input type="color" data-cmd="foreColor" title="Цвет текста" value="#1C2622">' +
      '<button type="button" data-cmd="createLink" title="Добавить ссылку к выделенному тексту">🔗</button>' +
      "</div>";
  }

  function wireFloatBar_() {
    var bar = document.getElementById("floatBar");
    if (!bar) return;

    function getRange_() {
      var sel = window.getSelection();
      return sel && sel.rangeCount ? sel.getRangeAt(0).cloneRange() : null;
    }
    function restoreRange_(r) {
      if (!r) return;
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(r);
    }

    bar.querySelectorAll("[data-cmd]").forEach(function (ctrl) {
      var cmd = ctrl.dataset.cmd;
      if (ctrl.tagName === "INPUT") {
        ctrl.addEventListener("mousedown", function () { SAVED_RANGE = getRange_(); });
        ctrl.addEventListener("input", function () {
          if (!ACTIVE_EDITABLE) return;
          ACTIVE_EDITABLE.focus();
          restoreRange_(SAVED_RANGE);
          document.execCommand(cmd, false, ctrl.value);
        });
      } else if (cmd === "createLink") {
        // prompt() крадёт фокус (и выделение) у contenteditable сильнее, чем
        // просто клик по кнопке — поэтому диапазон сохраняем на mousedown
        // и восстанавливаем перед execCommand, как для цветового пикера.
        ctrl.addEventListener("mousedown", function (e) { e.preventDefault(); SAVED_RANGE = getRange_(); });
        ctrl.addEventListener("click", function () {
          if (!ACTIVE_EDITABLE || !SAVED_RANGE || SAVED_RANGE.collapsed) {
            alert("Сначала выделите текст, к которому нужно добавить ссылку.");
            return;
          }
          var url = prompt("Ссылка (https://…):", "https://");
          if (!url) return;
          ACTIVE_EDITABLE.focus();
          restoreRange_(SAVED_RANGE);
          document.execCommand("createLink", false, url);
          ACTIVE_EDITABLE.querySelectorAll("a:not([target])").forEach(function (a) {
            a.target = "_blank"; a.rel = "noopener";
          });
        });
      } else {
        ctrl.addEventListener("mousedown", function (e) { e.preventDefault(); });
        ctrl.addEventListener("click", function () {
          if (!ACTIVE_EDITABLE) return;
          ACTIVE_EDITABLE.focus();
          document.execCommand(cmd, false, null);
        });
      }
    });
  }

  function showFloatBar_(el) {
    var bar = document.getElementById("floatBar");
    if (!bar) return;
    ACTIVE_EDITABLE = el;
    bar.classList.add("show");
    bar.classList.toggle("on-teal", el.classList.contains("on-teal"));
  }

  function hideFloatBar_() {
    var bar = document.getElementById("floatBar");
    if (bar) bar.classList.remove("show");
    ACTIVE_EDITABLE = null;
  }

  document.addEventListener("focusin", function (e) {
    var el = e.target.closest && e.target.closest(".editable");
    if (!el) return;
    showFloatBar_(el);
  });

  document.addEventListener("focusout", function (e) {
    var el = e.target.closest && e.target.closest(".editable");
    if (!el) return;
    setTimeout(function () {
      var a = document.activeElement;
      var stillEditing = a && a.closest && a.closest(".editable");
      var bar = document.getElementById("floatBar");
      var inToolbar = a && bar && bar.contains(a);
      if (!stillEditing && !inToolbar) hideFloatBar_();
    }, 0);
  });

  /* ------------------------------  карточка и вкладки  --------------------- */

  var TABS = [
    { key: "overview", label: "Обзор" },
    { key: "policies", label: "Политики" },
    { key: "notes", label: "Примечания" },
    { key: "projects", label: "Проекты" },
    { key: "checklist", label: "Чеклисты" },
    { key: "goals", label: "Цели" },
    { key: "metrics", label: "Метрики" },
    { key: "history", label: "История" }
  ];

  function isCircleId_(id) { return id.indexOf("c-") === 0; }

  function buildCard_(n) {
    var isCircle = isCircleId_(ID);
    document.title = n.name + (isCircle ? " — круг в iTeal" : " — роль в iTeal");
    var editing = ЭТО_АДМИН && EDITING;
    var html =
      '<div class="titlebar"><p class="kicker">' + (isCircle ? "Круг в iTeal" : "Роль в iTeal") + "</p>" +
      (ЭТО_АДМИН && !editing
        ? '<div class="pencilwrap"><button type="button" class="pencil-btn" id="editToggle" title="Действия" aria-label="Действия">✎</button>' +
          '<div class="pencilmenu" id="pencilMenu">' +
          '<button type="button" data-action="edit">Редактировать</button>' +
          '<button type="button" data-action="delete">Удалить</button>' +
          "</div></div>"
        : "") +
      "</div>" +
      (editing ? '<input class="h1input" id="fName" type="text" value="' + эк(n.name) + '">' : "<h1>" + эк(n.name) + "</h1>") +
      '<div class="rule"></div>' +
      (editing ? floatBarHtml_() : "") +
      heroHtml_(n) +
      (isCircle ? leaderFieldHtml_(n, editing) : assigneesHtml_(n, editing)) +
      '<div class="tabs" id="tabs">' + TABS.map(function (t) {
        return '<button type="button" class="tab' + (t.key === ACTIVE_TAB ? " on" : "") + '" data-tab="' + t.key + '">' + t.label + "</button>";
      }).join("") + "</div>" +
      '<div class="tabpanel' + (ACTIVE_TAB === "overview" ? " on" : "") + '" data-panel="overview">' + overviewHtml_(n, editing) + "</div>" +
      '<div class="tabpanel' + (ACTIVE_TAB === "policies" ? " on" : "") + '" data-panel="policies">' + listSectionHtml_("policies", n.policies || [], editing) + "</div>" +
      '<div class="tabpanel' + (ACTIVE_TAB === "notes" ? " on" : "") + '" data-panel="notes">' + notesTabHtml_(n, editing) + "</div>" +
      '<div class="tabpanel' + (ACTIVE_TAB === "projects" ? " on" : "") + '" data-panel="projects">' + listSectionHtml_("projects", n.projects || [], editing) + "</div>" +
      '<div class="tabpanel' + (ACTIVE_TAB === "checklist" ? " on" : "") + '" data-panel="checklist">' + checklistHtml_(n, editing) + "</div>" +
      '<div class="tabpanel' + (ACTIVE_TAB === "goals" ? " on" : "") + '" data-panel="goals">' + listSectionHtml_("goals", n.goals || [], editing) + "</div>" +
      '<div class="tabpanel' + (ACTIVE_TAB === "metrics" ? " on" : "") + '" data-panel="metrics">' + listSectionHtml_("metrics", n.metrics || [], editing) + "</div>" +
      '<div class="tabpanel' + (ACTIVE_TAB === "history" ? " on" : "") + '" data-panel="history">' + historyHtml_(n) + "</div>" +
      (editing ? '<div class="savebar"><button type="button" class="btn pri" id="saveAllBtn">Сохранить</button><button type="button" class="btn" id="cancelEditBtn">Отмена</button></div>' : "") +
      "<footer>iTeal — Connect people &amp; computers</footer>";
    $("#card").innerHTML = html;

    $("#tabs").querySelectorAll(".tab").forEach(function (btn) {
      btn.addEventListener("click", function () {
        ACTIVE_TAB = btn.dataset.tab;
        $("#tabs").querySelectorAll(".tab").forEach(function (b) { b.classList.toggle("on", b === btn); });
        document.querySelectorAll(".tabpanel").forEach(function (p) { p.classList.toggle("on", p.dataset.panel === ACTIVE_TAB); });
      });
    });

    wirePencilMenu_();

    if (!editing) return;

    wireFloatBar_();
    if (!isCircle) wireTagField_("assignees");
    wireListField_("domains");
    wireListField_("accountabilities");
    wireListField_("policies");
    wireListField_("projects");
    wireListField_("goals");
    wireListField_("metrics");
    wireChecklist_();
    wireAttachments_();

    document.getElementById("saveAllBtn").addEventListener("click", function (e) {
      var btn = e.currentTarget;
      btn.disabled = true; btn.textContent = "Сохраняю…";
      saveAll_(function (ok) {
        if (!ok) { btn.disabled = false; btn.textContent = "Сохранить"; return; }
        EDITING = false;
        buildCard_(CURRENT);
      });
    });
    document.getElementById("cancelEditBtn").addEventListener("click", function () {
      EDITING = false;
      buildCard_(CURRENT);
    });
  }

  function wirePencilMenu_() {
    var toggle = document.getElementById("editToggle");
    var menu = document.getElementById("pencilMenu");
    if (!toggle || !menu) return;

    toggle.addEventListener("click", function (e) {
      e.stopPropagation();
      menu.classList.toggle("show");
    });
    menu.querySelector('[data-action="edit"]').addEventListener("click", function () {
      menu.classList.remove("show");
      EDITING = true;
      buildCard_(CURRENT);
    });
    menu.querySelector('[data-action="delete"]').addEventListener("click", function () {
      menu.classList.remove("show");
      if (!confirm('Удалить роль «' + CURRENT.name + '» насовсем? Это нельзя отменить.')) return;
      orgAction("orgDelete", { id: ID }, function (ok, resOrWhy) {
        if (!ok) { alert("Не получилось: " + resOrWhy); return; }
        location.href = "org-structure.html";
      });
    });
  }

  document.addEventListener("click", function (e) {
    var menu = document.getElementById("pencilMenu");
    var toggle = document.getElementById("editToggle");
    if (menu && menu.classList.contains("show") && e.target !== toggle && !menu.contains(e.target)) {
      menu.classList.remove("show");
    }
  });

  function heroHtml_(n) {
    return n.photo ? '<div class="hero"><img src="' + n.photo + '" alt=""></div>' : "";
  }

  function assigneesHtml_(n, editing) {
    var items = n.assignees || [];
    if (!editing) {
      if (!items.length) return "";
      return '<p class="assignees"><b>Исполнители:</b> ' + items.map(эк).join(", ") + "</p>";
    }
    var tags = items.map(function (v) { return tagHtml_(v); }).join("");
    return '<div class="assignees"><b>Исполнители</b>' +
      '<div class="taglist" id="list-assignees">' + tags + "</div>" +
      '<button type="button" class="tagadd" data-field="assignees">+ добавить</button></div>';
  }

  /* Лидер круга — не свободный текст, а выбор одного из тех, кто уже указан
     исполнителем какой-либо роли внутри этого круга (в т.ч. вложенных
     подкругов). Пока у круга нет ни одной роли, список пуст — это нормально,
     он заполнится по мере добавления ролей. */
  function leaderCandidates_(circleId) {
    var set = {};
    (function walk(cid) {
      (ALL_CHILDREN[cid] || []).forEach(function (kid) {
        if (isLeaf_(kid)) {
          (ALL_NODES[kid].assignees || []).forEach(function (v) {
            v = String(v || "").trim();
            if (v) set[v] = true;
          });
        } else {
          walk(kid);
        }
      });
    })(circleId);
    return Object.keys(set).sort(function (a, b) { return a.localeCompare(b, "ru"); });
  }

  function leaderFieldHtml_(n, editing) {
    var current = String((n.assignees || [])[0] || "").trim();
    if (!editing) {
      return '<p class="assignees"><b>Лидер круга:</b> ' + (current ? эк(current) : "—") + "</p>";
    }
    var candidates = leaderCandidates_(ID);
    if (current && candidates.indexOf(current) === -1) candidates.push(current);
    var opts = '<option value="">— не выбран —</option>' + candidates.map(function (v) {
      return '<option value="' + эк(v) + '"' + (v === current ? " selected" : "") + ">" + эк(v) + "</option>";
    }).join("");
    return '<div class="assignees"><b>Лидер круга</b><select id="fLeader" class="leadersel">' + opts + "</select></div>";
  }

  function tagHtml_(value) {
    return '<span class="tag"><input type="text" class="chipinput" value="' + эк(value || "") +
      '"><button type="button" class="tagdel" aria-label="Удалить">×</button></span>';
  }

  function gatherLeader_() {
    var el = document.getElementById("fLeader");
    return el && el.value ? [el.value] : [];
  }

  function gatherTags_(fieldKey) {
    var list = document.getElementById("list-" + fieldKey);
    if (!list) return [];
    return Array.prototype.map.call(list.querySelectorAll(".chipinput"), function (el) { return el.value.trim(); }).filter(Boolean);
  }

  function wireTagField_(fieldKey) {
    var list = document.getElementById("list-" + fieldKey);
    if (!list) return;
    var addBtn = document.querySelector('.tagadd[data-field="' + fieldKey + '"]');
    if (addBtn) addBtn.addEventListener("click", function () {
      var wrap = document.createElement("span");
      wrap.innerHTML = tagHtml_("");
      var tag = wrap.firstChild;
      list.appendChild(tag);
      wireTagDelete_(tag);
      tag.querySelector(".chipinput").focus();
    });
    Array.prototype.forEach.call(list.querySelectorAll(".tag"), wireTagDelete_);
  }

  function wireTagDelete_(tag) {
    tag.querySelector(".tagdel").addEventListener("click", function () { tag.remove(); });
  }

  /* ---- Обзор: миссия (rich text) + домены + обязанности (тоже rich text) ---- */

  function overviewHtml_(n, editing) {
    return richFieldSectionHtml_("Миссия", "purpose", n.purpose, true, editing) +
      '<section class="sec" style="margin-top:32px"><p class="kicker mb">Домены</p>' + listBodyHtml_("domains", n.domains || [], editing) + "</section>" +
      '<section class="sec" style="margin-top:32px"><p class="kicker mb">Обязанности</p>' + listBodyHtml_("accountabilities", n.accountabilities || [], editing) + "</section>";
  }

  function richFieldSectionHtml_(title, fieldKey, html, onTeal, editing) {
    if (!editing) {
      var view = '<div class="rte-view">' + (html || '<span style="opacity:.7">—</span>') + "</div>";
      return onTeal
        ? '<section class="mission"><p class="kicker">' + title + "</p>" + view + "</section>"
        : '<section class="sec"><p class="kicker mb">' + title + "</p>" + view + "</section>";
    }
    var body = '<div class="rte editable' + (onTeal ? " on-teal" : "") + '" data-field="' + fieldKey + '" contenteditable="true">' + (html || "") + "</div>";
    return onTeal
      ? '<section class="mission"><p class="kicker">' + title + "</p>" + body + "</section>"
      : '<section class="sec"><p class="kicker mb">' + title + "</p>" + body + "</section>";
  }

  /* ---- списки через "+": домены/обязанности/политики/проекты/цели/метрики ---- */
  /* Пункты — contenteditable, а не <input>, чтобы к ним тоже применялось
     форматирование (включая списки/уровни) через общий плавающий тулбар. */

  var LIST_TITLES = { policies: "Политики", projects: "Проекты", goals: "Цели", metrics: "Метрики", domains: "Домены", accountabilities: "Обязанности" };

  function listSectionHtml_(fieldKey, items, editing) {
    var title = LIST_TITLES[fieldKey] || fieldKey;
    return '<section class="sec"><p class="kicker mb">' + title + "</p>" + listBodyHtml_(fieldKey, items, editing) + "</section>";
  }

  function listBodyHtml_(fieldKey, items, editing) {
    if (!editing) {
      if (!items.length) return '<p class="empty-hint">Пока пусто</p>';
      return '<div class="list">' + items.map(function (v, i) { return itemHtml_(i, v, false, fieldKey); }).join("") + "</div>";
    }
    return '<div class="list" id="list-' + fieldKey + '">' +
      (items.length ? items.map(function (v, i) { return itemHtml_(i, v, true, fieldKey); }).join("") : '<p class="empty-hint">Пока пусто</p>') +
      '</div><button type="button" class="listadd" data-field="' + fieldKey + '">+ добавить</button>';
  }

  function itemHtml_(i, html, editable, fieldKey) {
    var num = String(i + 1).length < 2 ? "0" + (i + 1) : String(i + 1);
    var body = editable
      ? '<div class="txt editable" contenteditable="true" data-list="' + fieldKey + '">' + (html || "") + "</div>"
      : '<div class="txt">' + (html || "") + "</div>";
    return '<div class="item"><span class="n">' + num + "</span>" + body +
      (editable ? '<button type="button" class="itemdel" aria-label="Удалить">×</button>' : "") + "</div>";
  }

  function renumber_(list) {
    Array.prototype.forEach.call(list.querySelectorAll(".item"), function (item, i) {
      var num = String(i + 1).length < 2 ? "0" + (i + 1) : String(i + 1);
      item.querySelector(".n").textContent = num;
    });
  }

  function gatherList_(fieldKey) {
    var list = document.getElementById("list-" + fieldKey);
    if (!list) return [];
    return Array.prototype.map.call(list.querySelectorAll(".editable"), function (el) {
      return sanitizeHtml_(el.innerHTML);
    }).filter(function (html) { return plainText_(html); });
  }

  function wireListField_(fieldKey) {
    var list = document.getElementById("list-" + fieldKey);
    if (!list) return;
    var addBtn = document.querySelector('.listadd[data-field="' + fieldKey + '"]');
    if (addBtn) addBtn.addEventListener("click", function () {
      var hint = list.querySelector(".empty-hint");
      if (hint) hint.remove();
      var wrap = document.createElement("div");
      wrap.innerHTML = itemHtml_(list.querySelectorAll(".item").length, "", true, fieldKey);
      var item = wrap.firstChild;
      list.appendChild(item);
      wireItemDelete_(list, item);
      item.querySelector(".editable").focus();
    });
    Array.prototype.forEach.call(list.querySelectorAll(".item"), function (item) { wireItemDelete_(list, item); });
  }

  function wireItemDelete_(list, item) {
    item.querySelector(".itemdel").addEventListener("click", function () {
      item.remove();
      renumber_(list);
    });
  }

  /* ---- примечания: rich text + вложения (ссылки на файлы/фото) ---- */

  function notesTabHtml_(n, editing) {
    return '<div class="notes-wrap">' +
      richFieldSectionHtml_("Примечания", "notes", n.notes, false, editing) +
      attachmentsHtml_(n, editing) +
      "</div>";
  }

  function parseAttachment_(line) {
    var idx = line.indexOf(РАЗД);
    return idx < 0 ? { name: line, url: line } : { name: line.slice(0, idx), url: line.slice(idx + 1) };
  }
  function isImageUrl_(url) { return /\.(png|jpe?g|gif|webp)(\?.*)?$/i.test(url); }

  function attachmentsHtml_(n, editing) {
    var items = (n.attachments || []).map(parseAttachment_);
    if (!editing) {
      if (!items.length) return "";
      return '<section class="sec"><p class="kicker mb">Вложения</p>' +
        items.map(function (it) { return attachmentViewHtml_(it); }).join("") + "</section>";
    }
    var rows = items.map(function (it, i) { return attachmentRowHtml_(i, it); }).join("");
    return '<section class="sec"><p class="kicker mb">Вложения</p>' +
      '<div class="list" id="list-attachments">' + (rows || '<p class="empty-hint">Пока пусто</p>') + "</div>" +
      '<div class="attaddrow"><input type="text" id="attNewName" placeholder="Название"><input type="text" id="attNewUrl" placeholder="Ссылка на файл/фото (Google Drive, Диск и т.д.)">' +
      '<button type="button" class="listadd" id="attAddBtn">+ добавить</button></div>' +
      '<p class="empty-hint" style="margin-top:8px">Файл сначала загрузите в Google Drive (или другое хранилище), затем вставьте сюда ссылку с доступом «по ссылке».</p></section>';
  }

  function attachmentViewHtml_(it) {
    return '<div class="attview">' +
      (isImageUrl_(it.url) ? '<img src="' + эк(it.url) + '" alt="">' : "") +
      '<a href="' + эк(it.url) + '" target="_blank" rel="noopener">' + эк(it.name || it.url) + "</a></div>";
  }

  function attachmentRowHtml_(i, it) {
    return '<div class="attrow" data-i="' + i + '">' +
      '<input type="text" class="attname" value="' + эк(it.name) + '" placeholder="Название">' +
      '<input type="text" class="atturl" value="' + эк(it.url) + '" placeholder="Ссылка">' +
      '<button type="button" class="itemdel" aria-label="Удалить">×</button></div>';
  }

  function gatherAttachments_() {
    var list = document.getElementById("list-attachments");
    if (!list) return [];
    return Array.prototype.map.call(list.querySelectorAll(".attrow"), function (row) {
      var name = row.querySelector(".attname").value.trim();
      var url = row.querySelector(".atturl").value.trim();
      return url ? (name ? name + РАЗД + url : url) : null;
    }).filter(Boolean);
  }

  function wireAttachments_() {
    var list = document.getElementById("list-attachments");
    if (!list) return;
    function wireRow(row) {
      row.querySelector(".itemdel").addEventListener("click", function () { row.remove(); });
    }
    Array.prototype.forEach.call(list.querySelectorAll(".attrow"), wireRow);
    var addBtn = document.getElementById("attAddBtn");
    if (!addBtn) return;
    addBtn.addEventListener("click", function () {
      var name = document.getElementById("attNewName").value.trim();
      var url = document.getElementById("attNewUrl").value.trim();
      if (!url) return;
      var hint = list.querySelector(".empty-hint");
      if (hint) hint.remove();
      var wrap = document.createElement("div");
      wrap.innerHTML = attachmentRowHtml_(list.querySelectorAll(".attrow").length, { name: name, url: url });
      var row = wrap.firstChild;
      list.appendChild(row);
      wireRow(row);
      document.getElementById("attNewName").value = "";
      document.getElementById("attNewUrl").value = "";
    });
  }

  /* ---- чек-лист: done + rich-text (contenteditable) ---- */

  function parseChecklistItem_(line) {
    var idx = line.indexOf(РАЗД);
    return idx < 0 ? { done: false, html: line } : { done: line.slice(0, idx) === "1", html: line.slice(idx + 1) };
  }

  function checklistHtml_(n, editing) {
    var items = (n.checklist || []).map(parseChecklistItem_);
    if (!editing) {
      if (!items.length) return '<p class="empty-hint">Пока пусто</p>';
      return '<div class="list">' + items.map(checklistItemViewHtml_).join("") + "</div>";
    }
    var rows = items.map(checklistItemHtml_).join("");
    return '<div class="list" id="list-checklist">' + (rows || '<p class="empty-hint">Пока пусто</p>') + "</div>" +
      '<button type="button" class="listadd" id="checklistAddBtn">+ добавить</button>';
  }

  function checklistItemViewHtml_(it) {
    return '<div class="citem' + (it.done ? " done" : "") + '"><input type="checkbox" disabled' + (it.done ? " checked" : "") + '><div class="ctext">' + (it.html || "") + "</div></div>";
  }

  function checklistItemHtml_(it) {
    return '<div class="citem' + (it.done ? " done" : "") + '"><input type="checkbox" class="cbox"' + (it.done ? " checked" : "") + '>' +
      '<div class="ctext editable" contenteditable="true" data-checklist>' + (it.html || "") + "</div>" +
      '<button type="button" class="itemdel" aria-label="Удалить">×</button></div>';
  }

  function gatherChecklist_() {
    var list = document.getElementById("list-checklist");
    if (!list) return [];
    return Array.prototype.map.call(list.querySelectorAll(".citem"), function (row) {
      var html = sanitizeHtml_(row.querySelector(".ctext").innerHTML);
      if (!plainText_(html)) return null;
      var done = row.querySelector(".cbox").checked;
      return (done ? "1" : "0") + РАЗД + html;
    }).filter(Boolean);
  }

  function wireChecklist_() {
    var list = document.getElementById("list-checklist");
    if (!list) return;
    function wireRow(row) {
      row.querySelector(".cbox").addEventListener("change", function () {
        row.classList.toggle("done", row.querySelector(".cbox").checked);
      });
      row.querySelector(".itemdel").addEventListener("click", function () { row.remove(); });
    }
    Array.prototype.forEach.call(list.querySelectorAll(".citem"), wireRow);
    var addBtn = document.getElementById("checklistAddBtn");
    if (!addBtn) return;
    addBtn.addEventListener("click", function () {
      var hint = list.querySelector(".empty-hint");
      if (hint) hint.remove();
      var wrap = document.createElement("div");
      wrap.innerHTML = checklistItemHtml_({ done: false, html: "" });
      var row = wrap.firstChild;
      list.appendChild(row);
      wireRow(row);
      row.querySelector(".ctext").focus();
    });
  }

  /* ---- история: реальный, но ограниченный журнал (последние 50 записей) ---- */

  function historyHtml_(n) {
    var lines = (n.history || []).slice().reverse();
    if (!lines.length) {
      return '<div class="hist"><p class="empty-hint">Изменений ещё не было</p></div>';
    }
    var rows = lines.map(function (line) {
      var parts = line.split(РАЗД);
      var when = fmtHistoryDate_(parts[0]);
      var who = parts[1] || "";
      var what = parts[2] || "Изменено";
      return '<div class="histrow"><b>' + эк(what) + "</b><span>" + эк(when) + (who ? " · " + эк(who) : "") + "</span></div>";
    }).join("");
    return '<div class="hist"><div class="histlist">' + rows + "</div>" +
      '<p class="note">Показаны последние ' + lines.length + " запис" + (lines.length === 1 ? "ь" : lines.length < 5 ? "и" : "ей") + " — журнал хранит не более 50.</p></div>";
  }

  function fmtHistoryDate_(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso || "";
    return d.toLocaleString("ru-RU");
  }

  /* ------------------------------  мини-карта структуры  ------------------- */
  /* Чтобы при переходе на роль/круг не терялось ощущение "где я нахожусь" —
     справа держим уменьшенную версию всей карты (та же раскладка d3.pack(),
     что на org-structure.html) с подсветкой текущего узла, плюс список
     соседей по тому же кругу снизу. Клик по роли ведёт на её страницу,
     клик по кругу — на карту структуры с этим кругом открытым. */

  var ALL_NODES = {};
  var ALL_CHILDREN = {};

  function buildIndex_(nodes) {
    ALL_NODES = {}; ALL_CHILDREN = {};
    nodes.forEach(function (n) { ALL_NODES[n.id] = n; ALL_CHILDREN[n.id] = []; });
    nodes.forEach(function (n) { if (n.parent && ALL_CHILDREN[n.parent]) ALL_CHILDREN[n.parent].push(n.id); });
  }

  function isLeaf_(id) { return (ALL_CHILDREN[id] || []).length === 0; }

  function toHierarchy_(id) {
    var n = ALL_NODES[id];
    return { id: n.id, name: n.name, children: (ALL_CHILDREN[id] || []).map(toHierarchy_) };
  }

  function goToNode_(id) {
    if (id === ID) return;
    if (id !== "root" && isLeaf_(id)) location.href = "role.html?id=" + encodeURIComponent(id);
    else location.href = "org-structure.html?focus=" + encodeURIComponent(id);
  }

  function buildMinimap_() {
    if (!ALL_NODES.root) return;
    var W = 300, H = 300;
    var root = d3.hierarchy(toHierarchy_("root"), function (d) { return d.children; }).count();
    var pack = d3.pack().size([W - 6, H - 6]).padding(function (d) { return d.depth === 0 ? 3 : 7; });
    pack(root);
    root.descendants().forEach(function (d) {
      if (d.depth === 0) return;
      d.r *= 0.78;
      d.x = root.x + (d.x - root.x) * 0.78;
      d.y = root.y + (d.y - root.y) * 0.78;
    });

    var svg = document.getElementById("miniSvg");
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.innerHTML = "";
    var ns = "http://www.w3.org/2000/svg";
    var g = document.createElementNS(ns, "g");
    g.setAttribute("transform", "translate(3,3)");
    svg.appendChild(g);

    root.descendants().forEach(function (d) {
      var leaf = d.data.id !== "root" && isLeaf_(d.data.id);
      var filled = leaf && (ALL_NODES[d.data.id].assignees || []).length > 0;
      var kind = leaf ? (filled ? "leaf-filled" : "leaf-empty") : (d.depth === 0 ? "root" : "container");
      var c = document.createElementNS(ns, "circle");
      c.setAttribute("cx", d.x); c.setAttribute("cy", d.y); c.setAttribute("r", d.r);
      c.setAttribute("class", "node-circle " + kind + (d.data.id === ID ? " current" : ""));
      c.addEventListener("click", function () { goToNode_(d.data.id); });
      var title = document.createElementNS(ns, "title");
      title.textContent = d.data.name;
      c.appendChild(title);
      g.appendChild(c);

      var showLabel = leaf ? d.r >= 16 : d.r >= 26;
      if (showLabel) {
        var layout = layoutLabel_(d.data.name, d.r, leaf);
        var cls = "node-label" + (filled ? " on-fill" : "") + (!leaf ? " container" : "");
        var lineHeight = layout.fontSize * 1.15;
        var startY = leaf ? d.y - (layout.lines.length - 1) * lineHeight / 2 : d.y - d.r + layout.fontSize + 4;
        layout.lines.forEach(function (line, i) {
          var t = document.createElementNS(ns, "text");
          t.setAttribute("x", d.x);
          t.setAttribute("y", startY + i * lineHeight);
          t.setAttribute("font-size", layout.fontSize);
          t.setAttribute("class", cls);
          t.setAttribute("pointer-events", "none");
          if (leaf) t.setAttribute("dominant-baseline", "middle");
          t.textContent = line;
          g.appendChild(t);
        });
      }
    });
  }

  /* Тот же перенос по словам + уменьшение шрифта, что и на основной карте
     (org-structure.html) — многоточие только как самый последний вариант. */
  function layoutLabel_(name, r, leaf) {
    var text = String(name || "").trim();
    if (!text) return { fontSize: 0, lines: [] };
    var maxLines = leaf ? 3 : 2;
    var minFs = 7;
    var fs = Math.max(minFs, Math.min(leaf ? 13 : 12, r / (leaf ? 3.2 : 3.6)));
    var availWidth = r * (leaf ? 1.5 : 1.35);
    var words = text.split(/\s+/);
    var lines = [];
    for (var attempt = 0; attempt < 6; attempt++) {
      var maxChars = Math.max(3, Math.floor(availWidth / (fs * 0.56)));
      lines = переносСлов_(words, maxChars);
      if (lines.length <= maxLines || fs <= minFs) break;
      fs -= 1;
    }
    if (lines.length > maxLines) {
      var maxChars2 = Math.max(3, Math.floor(availWidth / (fs * 0.56)));
      lines = lines.slice(0, maxLines);
      var last = lines[maxLines - 1];
      if (last.length > maxChars2 - 1) last = last.slice(0, Math.max(1, maxChars2 - 2));
      lines[maxLines - 1] = last.replace(/\s+$/, "") + "…";
    }
    return { fontSize: fs, lines: lines };
  }

  function переносСлов_(words, maxChars) {
    var lines = [];
    var cur = "";
    words.forEach(function (w) {
      while (w.length > maxChars) {
        if (cur) { lines.push(cur); cur = ""; }
        lines.push(w.slice(0, Math.max(1, maxChars - 1)) + "-");
        w = w.slice(Math.max(1, maxChars - 1));
      }
      var next = cur ? cur + " " + w : w;
      if (cur && next.length > maxChars) { lines.push(cur); cur = w; } else { cur = next; }
    });
    if (cur) lines.push(cur);
    return lines;
  }

  function buildSiblings_() {
    var box = document.getElementById("siblingsBox");
    var n = ALL_NODES[ID];
    if (!n || !box) { if (box) box.innerHTML = ""; return; }
    var parent = ALL_NODES[n.parent];
    var siblingIds = parent ? (ALL_CHILDREN[parent.id] || []) : [];
    if (!parent || !siblingIds.length) { box.innerHTML = ""; return; }
    var rows = siblingIds.map(function (sid) {
      var s = ALL_NODES[sid];
      var href = (sid !== "root" && isLeaf_(sid)) ? "role.html?id=" + encodeURIComponent(sid) : "org-structure.html?focus=" + encodeURIComponent(sid);
      return '<a href="' + href + '"' + (sid === ID ? ' class="current"' : "") + ">" + эк(s.name) + "</a>";
    }).join("");
    box.innerHTML = '<h3>' + эк(parent.name) + "</h3>" + rows;
  }

  document.getElementById("toTop").addEventListener("click", function () {
    var rm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    window.scrollTo({ top: 0, behavior: rm ? "auto" : "smooth" });
  });

  load();
})();
</script>
</body>
</html>
