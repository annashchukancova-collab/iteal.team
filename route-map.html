<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Маршрутная карта адаптации · iTeal</title>
<!-- Общие стили iTeal: токены брендбука и базовые элементы.
     Подключается и в «Список», и в «Карту» через include -->
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* ---- токены брендбука iTeal ---- */
  --it-teal:#43836D; --it-teal-deep:#2C5748; --it-mint:#7AC1A8; --it-accent:#FFD54F;
  --it-ink:#1C2622; --it-ink-soft:#3B4742; --it-grey:#6B7A75; --it-grey-light:#8C9994;
  --it-line:#E4EAE7; --it-paper:#F5F8F6; --it-white:#fff;
  --state-hover:#38705C; --state-pressed:var(--it-teal-deep);

  /* ---- интерфейсный статус, НЕ элемент бренда ----
     Тон взят из рисованных стикеров (#FF2A0E), но приглушён: чистый оттенок
     режет глаз и не проходит по контрасту на белом (3,8 против нужных 4,5).
     Заливки и кромки — #B4483C, мелкий текст — затемнённый #93372C. */
  --status-alert:#B4483C; --status-alert-text:#93372C; --status-warn:#6B7A75;

  --radius-sm:0; --radius-md:0;   /* прямые углы по всему сайту */
  --shadow-sm:0 1px 2px rgba(28,38,34,.06);
  --font-heading:'Ubuntu','Verdana',sans-serif;
  --font-body:'Open Sans','Arial',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--it-paper);color:var(--it-ink-soft);
  font:400 16px/1.6 var(--font-body);padding:32px 24px 96px}
.page{position:relative;max-width:1080px;margin:0 auto}
img{display:block}
a{color:var(--it-teal)}
:focus-visible{outline:2px solid var(--it-teal);outline-offset:2px}

.logo{height:64px;width:auto;margin-bottom:32px}
.kicker{font:700 13px/1 var(--font-body);letter-spacing:.2em;text-transform:uppercase;color:var(--it-teal)}
h1{font:700 32px/1.15 var(--font-heading);color:var(--it-teal-deep);margin:16px 0 0}
.lead{margin-top:16px;max-width:60ch}
.me{display:inline-flex;align-items:center;gap:12px;margin-top:24px;background:var(--it-white);
  border:1px solid var(--it-line);border-radius:var(--radius-md);padding:8px 14px;font-size:14px}
.me b{font-family:var(--font-heading);font-weight:500;color:var(--it-ink)}
.me .role{font:700 13px/1 var(--font-body);letter-spacing:.2em;text-transform:uppercase;
  color:var(--it-teal);background:var(--it-paper);border-radius:var(--radius-sm);padding:5px 9px}
.me .hint{color:var(--it-grey)}

/* картинки: превью под заголовком и полоса под списком */
.hero{margin-top:32px;border-radius:var(--radius-md);overflow:hidden}
.hero img{width:100%;height:auto}
.strip{margin-top:48px;border-radius:var(--radius-md);overflow:hidden}
.strip img{width:100%;height:auto}

/* панель */
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:48px}
.btn{font:600 14px var(--font-body);border:1px solid var(--it-teal);background:var(--it-white);
  color:var(--it-teal);border-radius:var(--radius-sm);padding:9px 16px;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;
  transition:background 140ms ease-out,color 140ms ease-out}
.btn:hover{background:rgba(122,193,168,.1)}
.btn:active{border-color:var(--state-pressed);color:var(--state-pressed)}
.btn.pri{background:var(--it-teal);color:var(--it-white)}
.btn.pri:hover{background:var(--state-hover)}
.btn.pri:active{background:var(--state-pressed)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.small{font-size:13px;padding:6px 12px}
.btn.danger{border-color:var(--status-alert);color:var(--status-alert-text)}
.btn.danger:hover{background:var(--status-alert);border-color:var(--status-alert);color:var(--it-white)}
.btn .i{width:16px;height:16px}
.spacer{flex:1}
.count{font-size:14px;color:var(--it-grey)}

/* сообщения */
.msg{margin-top:24px;padding:12px 16px;border-radius:var(--radius-md);font-size:14px;
  background:var(--it-white);border:1px solid var(--it-line)}
.msg.err{border-left:3px solid var(--status-alert);color:var(--status-alert-text)}
.msg.ok{border-left:3px solid var(--it-teal);color:var(--it-teal-deep)}
.msg[hidden]{display:none}

/* карточки */
.grid{display:grid;gap:16px;margin-top:24px}
.card{background:var(--it-white);border:1px solid var(--it-line);border-radius:var(--radius-md);
  box-shadow:var(--shadow-sm);padding:16px 20px;display:grid;
  grid-template-columns:1fr 240px 160px;gap:24px;align-items:center}
.card.alert{border-left:3px solid var(--status-alert)}
.card.arch{background:var(--it-paper);box-shadow:none}
.who .nm{font:700 19px/1.2 var(--font-heading);color:var(--it-ink)}
.who .meta{font-size:14px;color:var(--it-grey);margin-top:8px}
.who .step{display:inline-block;margin-top:8px;font:600 13px var(--font-body);
  color:var(--it-teal-deep);background:var(--it-paper);border-radius:var(--radius-sm);padding:4px 10px}
.who .step.none{color:var(--it-grey)}
.prog .top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;
  color:var(--it-grey);margin-bottom:8px}
.prog .top b{font:700 19px/1 var(--font-heading);color:var(--it-ink)}
.track{height:8px;border-radius:var(--radius-sm);background:var(--it-line);overflow:hidden}
.fill{height:100%;background:var(--it-teal)}
.fill.alert{background:var(--status-alert)}
.prog .extra{font-size:13px;color:var(--it-grey);margin-top:8px;line-height:1.5}
.act{display:flex;flex-direction:column;gap:8px}
.act .open{justify-content:center;text-decoration:none}
.warn{color:var(--status-alert-text);font-weight:600}
.soon{color:var(--status-warn);font-weight:600}

/* форма */
.form{margin-top:24px;background:var(--it-white);border:1px solid var(--it-line);
  border-radius:var(--radius-md);padding:24px}
.form h2{font:700 19px/1.2 var(--font-heading);color:var(--it-ink);margin:16px 0 8px}
.form .note{font-size:14px;color:var(--it-grey);max-width:60ch}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:24px}
.f{display:flex;flex-direction:column;gap:8px}
.f label{font:600 13px var(--font-body);color:var(--it-grey)}
.f input{font:400 16px var(--font-body);color:var(--it-ink);background:var(--it-white);
  border:1px solid var(--it-line);border-radius:var(--radius-sm);padding:10px 12px;
  transition:border-color 140ms ease-out}
.f input:focus{outline:none;border-color:var(--it-teal)}
.form .row{display:flex;gap:8px;align-items:center;margin-top:24px;flex-wrap:wrap}
.form .hint{font-size:14px;color:var(--it-grey)}
.form .hint.err{color:var(--status-alert-text)}

.ltabs{display:flex;gap:8px;margin-top:24px;flex-wrap:wrap}
.ltab{font:700 14px var(--font-body);background:var(--it-white);border:1px solid var(--it-line);
  border-bottom:3px solid transparent;color:var(--it-ink-soft);padding:11px 18px;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;transition:color 140ms ease-out}
.ltab:hover{color:var(--it-teal)}
.ltab.on{color:var(--it-teal-deep);border-bottom-color:var(--it-teal);box-shadow:var(--shadow-sm)}
.ltab i{font-style:normal;font-weight:600;font-size:13px;color:var(--it-grey)}
.ltab.on i{color:var(--it-teal)}
.linkcard{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-top:24px;
  padding:20px;background:var(--it-white);border:1px solid var(--it-line);border-left:3px solid var(--it-teal);
  box-shadow:var(--shadow-sm);text-decoration:none;transition:background 140ms ease-out}
.linkcard:hover{background:var(--it-paper)}
.linkcard .nm{display:block;font:700 19px/1.2 var(--font-heading);color:var(--it-ink)}
.linkcard .ds{display:block;margin-top:8px;font-size:14px;color:var(--it-grey);max-width:60ch}
.linkcard .btn{flex:none;pointer-events:none}
.linkcard[hidden]{display:none}
.skeleton{height:96px;border-radius:var(--radius-md);background:var(--it-white);
  border:1px solid var(--it-line)}
footer{margin-top:48px;font-size:13px;color:var(--it-grey-light);max-width:60ch}

@media (max-width:820px){
  h1{font-size:26px}
  .card{grid-template-columns:1fr;gap:16px}
}
</style>
<style>
#view-card{
  --bg:#F1F5F2; --paper:#FFFFFF; --ink:#233028; --muted:#6B7280; --hairline:#E1E6F2;
  --brand:#43836D; --brand-dark:#2F5D4E; --mint:#7AC1A8; --yellow:#FFD42E;
  --sky:#ADE6FA; --blue:#4D70AC;
  --path:#cdd7d1; --travel:#43836D;
  --shadow:0 10px 30px rgba(38,49,44,.08);
  --font-display:'Avenir Next','Century Gothic',-apple-system,'Segoe UI',sans-serif;
  --font-body:-apple-system,'Avenir Next','Segoe UI',Helvetica,Arial,sans-serif;
}
#view-card *{box-sizing:border-box}
#view-card, #view-card{margin:0;padding:0}
#view-card{
  background:
    radial-gradient(720px 460px at 100% 0%, #E7F1EC 0%, rgba(231,241,236,0) 70%),
    radial-gradient(680px 520px at 0% 22%, #EAF3F8 0%, rgba(234,243,248,0) 70%),
    var(--bg);
  color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
#view-card .wrap{max-width:1040px;margin:0 auto;padding:34px 22px 140px}
#view-card a{color:var(--brand)}
#view-card :focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
#view-card /* ---------- шапка ---------- */
img.logo{display:block;height:46px;width:auto;margin-bottom:22px}
#view-card .head{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
#view-card .head .txt{flex:1 1 420px;min-width:280px}
#view-card h1{font-family:var(--font-display);font-weight:800;font-size:32px;line-height:1.14;margin:0 0 8px}
#view-card h1 em{font-style:normal;color:var(--brand)}
#view-card .sub{color:var(--muted);margin:0;max-width:64ch}
#view-card .hbadge{flex:0 0 auto;background:var(--paper);border:1px solid var(--hairline);border-radius:20px;
  padding:12px 18px;box-shadow:var(--shadow);text-align:center;min-width:150px}
#view-card .hbadge b{display:block;font-family:var(--font-display);font-weight:800;font-size:28px;color:var(--brand);line-height:1}
#view-card .hbadge span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
#view-card .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--brand)}
#view-card .lbl.m{color:var(--muted)}
#view-card /* ---------- баннер ---------- */
.banner{margin:24px 0 0;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);background:#EAF3F8}
#view-card .banner img{display:block;width:100%;height:auto}
#view-card /* ---------- анкета ---------- */
.card-plate{margin:18px 0 0;background:var(--paper);border:1px solid var(--hairline);border-radius:18px;
  padding:16px 18px;box-shadow:var(--shadow)}
#view-card .card-plate h2{font-family:var(--font-display);font-weight:800;font-size:16px;margin:4px 0 12px}
#view-card .fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
#view-card .f{display:flex;flex-direction:column;gap:4px}
#view-card .f label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted)}
#view-card .f input{border:1px solid var(--hairline);border-radius:11px;padding:8px 11px;font:600 14px var(--font-body);
  color:var(--ink);background:#FCFDFC}
#view-card .f input:focus{outline:0;border-color:var(--brand)}
#view-card /* ---------- тулбар ---------- */
.bar{position:sticky;top:0;z-index:60;margin:22px 0 6px;padding:12px 14px;border-radius:20px;
  background:rgba(241,245,242,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--hairline)}
#view-card .barrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#view-card .stagecount{font-size:13px;color:var(--muted);font-weight:600}
#view-card .spacer{flex:1}
#view-card .btn{border:1px solid var(--hairline);background:var(--paper);color:var(--ink);border-radius:20px;
  padding:7px 14px;font:600 13px var(--font-body);cursor:pointer;transition:.15s}
#view-card .btn:hover{border-color:var(--brand);color:var(--brand)}
#view-card .btn.warn:hover{border-color:#C9736A;color:#C9736A}
#view-card .pwrap{height:9px;border-radius:20px;background:#E3EAE5;margin-top:11px;overflow:hidden}
#view-card .pbar{height:100%;width:0;border-radius:20px;background:linear-gradient(90deg,var(--mint),var(--brand));transition:width .3s}
#view-card .pnote{margin-top:6px;font-size:11px;color:var(--muted);font-weight:600}
#view-card .btn.send{border-color:var(--brand);color:var(--brand);font-weight:700}
#view-card .btn.send:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
#view-card .sendbox{margin-top:9px;font-size:12.5px;line-height:1.45;color:#3d4a42;background:var(--paper);
  border:1px solid var(--hairline);border-radius:14px;padding:10px 12px}
#view-card .sendbox b{color:var(--brand-dark)}
#view-card .sendbox.err{border-color:#E6CCC7;background:#FDF7F6}
#view-card .sendbox code{font-size:11.5px;background:#F2F6F3;border-radius:5px;padding:1px 5px}
#view-card .sendbox .dl{color:var(--blue);font-weight:700;text-decoration:underline;cursor:pointer;background:none;
  border:0;padding:0;font-size:12.5px;font-family:inherit}
#view-card /* ---------- тропа ---------- */
.trail{position:relative;margin-top:8px}
#view-card .sthead{display:flex;align-items:center;gap:12px;margin:30px 0 12px;padding:12px 14px;background:var(--paper);
  border:1px solid var(--hairline);border-radius:16px;box-shadow:var(--shadow);cursor:pointer;width:100%;text-align:left}
#view-card .snum{flex:none;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;
  font-family:var(--font-display);font-weight:800;font-size:15px;color:var(--brand-dark)}
#view-card .sttl{flex:1;min-width:0}
#view-card .sttl b{display:block;font-family:var(--font-display);font-weight:800;font-size:16px}
#view-card .sttl span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
#view-card .stcnt{flex:none;font-size:12px;font-weight:700;color:var(--muted);background:#F2F6F3;border-radius:20px;padding:4px 10px}
#view-card .stcnt.full{color:var(--brand);background:#E7F1EC}
#view-card .chev{flex:none;color:var(--muted);transition:transform .2s;font-size:13px}
#view-card .stage.collapsed .chev{transform:rotate(-90deg)}
#view-card .stage.collapsed .sbody{display:none}
#view-card .stnote{margin:0 0 6px;font-size:12.5px;color:#4a5a51;background:#F7FAF8;border-left:3px solid var(--mint);
  border-radius:0 8px 8px 0;padding:8px 11px}
#view-card .daybar{display:flex;align-items:center;gap:10px;margin:16px 0 2px;padding:0 2px}
#view-card .daybar b{font-family:var(--font-display);font-weight:800;font-size:13px;color:var(--brand-dark);
  background:#E7F1EC;border-radius:20px;padding:4px 12px}
#view-card .daybar i{flex:1;height:1px;background:var(--hairline)}
#view-card .row{display:grid;grid-template-columns:46px 1fr;align-items:stretch}
#view-card .row .spine{grid-column:1;position:relative;min-height:56px}
#view-card .row>.card{grid-column:2}
#view-card .ph{display:none}
#view-card .spine::before{content:"";position:absolute;left:50%;top:0;bottom:-2px;transform:translateX(-1px);
  border-left:2px dashed var(--path)}
#view-card .trav{position:absolute;left:50%;top:0;height:0;transform:translateX(-1.5px);border-left:3px solid var(--travel);
  transition:height .3s;border-radius:2px}
#view-card .spine.done .trav{height:calc(100% + 2px)}
#view-card .node{position:absolute;left:50%;top:22px;width:20px;height:20px;margin-left:-10px;border-radius:50%;
  background:var(--paper);border:2.5px solid var(--path);display:grid;place-items:center;z-index:2}
#view-card .node svg{opacity:0;width:11px;height:11px}
#view-card .node.done{background:var(--travel);border-color:var(--travel)}
#view-card .node.done svg{opacity:1}
#view-card .card{position:relative;margin:8px 0;background:var(--paper);border:1px solid var(--hairline);border-radius:14px;
  padding:13px 15px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s,border-color .15s}
#view-card .card:hover{transform:translateY(-1px);border-color:#cfe0d7}
#view-card .card::after{content:"";position:absolute;top:31px;left:-19px;width:18px;border-top:2px dashed var(--path)}
#view-card .row>.card.done::after{border-top-style:solid;border-color:var(--travel)}
#view-card .ctop{display:flex;gap:11px;align-items:flex-start}
#view-card .cb{flex:none;width:22px;height:22px;border:2.5px solid var(--brand);border-radius:7px;display:grid;place-items:center;
  background:var(--paper);transition:.15s}
#view-card .cb svg{opacity:0;width:12px;height:12px}
#view-card .card.done .cb, #view-card .rc.done .cb{background:var(--brand)}
#view-card .card.done .cb svg, #view-card .rc.done .cb svg{opacity:1}
#view-card .stepno{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
#view-card .res{margin:3px 0 0;font-size:14.5px}
#view-card .card.done .res{color:#7d8a83}
#view-card .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
#view-card .chip{font-size:11px;font-weight:700;border-radius:20px;padding:3px 10px;background:#EEF3F0;color:var(--brand-dark)}
#view-card .fmt{font-size:11px;font-weight:700;border-radius:20px;padding:3px 10px;background:#F2F6F3;color:#4a5a51;
  border:1px solid var(--hairline)}
#view-card .lnk{font-size:11.5px;font-weight:600;border-radius:20px;padding:3px 10px;text-decoration:none;
  border:1px solid #d9e3f0;color:var(--blue);background:#F5F8FC}
#view-card .lnk:hover{background:#EAF1F9}
#view-card .note{margin-top:9px;font-size:12.5px;color:#4a5a51;background:#F7FAF8;border-left:3px solid var(--mint);
  border-radius:0 8px 8px 0;padding:7px 10px}
#view-card .note a{color:var(--blue)}
#view-card .plan{margin-top:9px;font-size:12.5px;color:var(--brand-dark);background:#FFFBEA;border:1px solid #EFE4B0;
  border-radius:10px;padding:7px 10px;font-weight:600}
#view-card /* ---------- маркер «ты здесь» — котёнок ---------- */
.walker{position:absolute;left:0;top:0;width:46px;height:46px;margin-left:-23px;margin-top:-23px;
  pointer-events:none;z-index:6}
#view-card .walker img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;
  border:3px solid var(--paper);box-shadow:0 8px 18px rgba(38,49,44,.3);background:var(--paper)}
#view-card .walker::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2.5px solid var(--brand);
  animation:ring 2.2s infinite}
@keyframes ring{0%{transform:scale(.92);opacity:.85}70%{transform:scale(1.3);opacity:0}100%{transform:scale(1.3);opacity:0}}
#view-card /* ---------- финиш ---------- */
.finish{margin-top:26px;display:flex;flex-direction:column;align-items:center;
  background:linear-gradient(180deg,rgba(173,230,250,.22),rgba(122,193,168,.16));
  border:1px solid var(--hairline);border-radius:18px;padding:14px 14px 22px}
#view-card .finishart{width:100%;position:relative}
#view-card .finishart img{display:block;width:100%;height:auto;border-radius:14px;box-shadow:var(--shadow);
  filter:saturate(.55) opacity(.6);transition:filter .5s}
#view-card .finish.on .finishart img{filter:none}
#view-card .fcap{margin-top:10px;text-align:center;font-family:var(--font-display);font-weight:800;font-size:18px;
  color:#9aa7a0;transition:color .3s}
#view-card .finish.on .fcap{color:var(--brand-dark)}
#view-card .fsub{margin-top:4px;font-size:12.5px;color:var(--muted);text-align:center;max-width:52ch}
#view-card /* ---------- самообучение ---------- */
.study{margin-top:34px;border-radius:18px;padding:20px;
  background:linear-gradient(135deg,#E7F1EC 0%,#EAF3F8 100%);border:1px solid var(--hairline)}
#view-card .study h2{font-family:var(--font-display);font-weight:800;font-size:19px;margin:6px 0 4px}
#view-card .study .hint{color:var(--muted);font-size:13px;margin:0 0 14px}
#view-card .sgroup{margin-top:14px}
#view-card .rcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
#view-card .rc{background:var(--paper);border:1px solid var(--hairline);border-radius:14px;padding:11px 13px;
  display:flex;gap:10px;align-items:flex-start;cursor:pointer;box-shadow:var(--shadow);transition:.15s}
#view-card .rc:hover{border-color:#cfe0d7}
#view-card .rc.done{opacity:.72}
#view-card .rc .t{font-size:13.5px;font-weight:600}
#view-card .rc.done .t{color:#7d8a83}
#view-card .rc .src{margin-top:6px;font-size:11.5px;color:var(--muted)}
#view-card .dur{font-size:11px;font-weight:700;border-radius:20px;padding:3px 9px;background:#FFF9E0;color:#8a6d00;
  border:1px solid #e8dca8}
#view-card /* ---------- вкладки ---------- */
.tabs{display:flex;gap:8px;margin:20px 0 4px;flex-wrap:wrap}
#view-card .tab-btn{border:1px solid var(--hairline);background:var(--paper);color:#4a5a51;border-radius:14px 14px 0 0;
  padding:11px 16px;font:700 13.5px var(--font-display);cursor:pointer;transition:.15s;
  border-bottom:3px solid transparent;display:flex;align-items:center;gap:9px}
#view-card .tab-btn:hover{color:var(--brand)}
#view-card .tab-btn.on{color:var(--brand-dark);border-bottom-color:var(--brand);box-shadow:var(--shadow)}
#view-card .tab-btn i{font-style:normal;font-size:11px;font-weight:700;color:var(--muted);background:#F2F6F3;
  border-radius:20px;padding:2px 8px}
#view-card .tab-btn.on i{color:var(--brand);background:#E7F1EC}
#view-card .panel{display:none}
#view-card .panel.on{display:block}
#view-card /* ---------- обратная связь ---------- */
.fb{margin-top:8px}
#view-card .fbhead{background:var(--paper);border:1px solid var(--hairline);border-radius:18px;padding:16px 18px;
  box-shadow:var(--shadow)}
#view-card .fbhead h2{font-family:var(--font-display);font-weight:800;font-size:18px;margin:4px 0 6px}
#view-card .fbhead p{margin:0;color:#3d4a42;font-size:13.5px}
#view-card .periods{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
#view-card .pbtn{border:1px solid var(--hairline);background:#FCFDFC;border-radius:20px;padding:7px 14px;
  font:700 12.5px var(--font-body);color:#4a5a51;cursor:pointer;transition:.15s}
#view-card .pbtn:hover{border-color:var(--brand);color:var(--brand)}
#view-card .pbtn.on{background:var(--brand);border-color:var(--brand);color:#fff}
#view-card .blk{margin-top:22px}
#view-card .blk>h3{font-family:var(--font-display);font-weight:800;font-size:15px;margin:0 0 10px;
  color:var(--brand-dark);background:#E7F1EC;border-radius:20px;padding:7px 14px;display:inline-block}
#view-card .grp{margin:16px 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted)}
#view-card .qrow{background:var(--paper);border:1px solid var(--hairline);border-radius:14px;padding:12px 14px;margin-bottom:9px;
  box-shadow:var(--shadow)}
#view-card .qrow .qt{font-size:14px;display:flex;gap:9px}
#view-card .qrow .qt em{font-style:normal;color:var(--muted);font-weight:700;font-size:12px;flex:none;padding-top:2px}
#view-card .scale{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
#view-card .sc{width:34px;height:34px;border:1px solid var(--hairline);background:#FCFDFC;border-radius:10px;
  font:800 13px var(--font-display);color:#4a5a51;cursor:pointer;transition:.12s}
#view-card .sc:hover{border-color:var(--brand);color:var(--brand)}
#view-card .sc.on{background:var(--brand);border-color:var(--brand);color:#fff}
#view-card .sc.wide{width:auto;padding:0 9px;font-size:12px}
#view-card .cmt{flex:1;min-width:180px;border:1px solid var(--hairline);border-radius:10px;padding:7px 10px;
  font:500 13px var(--font-body);color:var(--ink);background:#FCFDFC}
#view-card .cmt:focus{outline:0;border-color:var(--brand)}
#view-card .qrow textarea{width:100%;margin-top:9px;border:1px solid var(--hairline);border-radius:10px;padding:8px 10px;
  font:500 13.5px var(--font-body);color:var(--ink);background:#FCFDFC;min-height:64px;resize:vertical}
#view-card .qrow textarea:focus{outline:0;border-color:var(--brand)}
#view-card .fbnote{margin-top:10px;font-size:12px;color:var(--muted)}
#view-card footer{margin-top:40px;font-size:11.5px;color:var(--muted);line-height:1.6}
@media (max-width:820px){#view-card h1{font-size:26px}
#view-card .row{grid-template-columns:38px 1fr}
#view-card .walker{width:34px;height:34px;margin-left:-17px;margin-top:-17px}
#view-card .tab-btn{padding:9px 12px;font-size:12.5px}

}
@media (prefers-reduced-motion:reduce){#view-card *{animation:none!important;transition:none!important}}
@media print{#view-card{background:#fff}
#view-card .bar, #view-card .chev, #view-card .walker, #view-card .tabs{display:none!important}
#view-card .stage.collapsed .sbody{display:block!important}
#view-card .panel{display:block!important}
#view-card .card, #view-card .card-plate, #view-card .sthead, #view-card .rc, #view-card .qrow, #view-card .fbhead{box-shadow:none}
#view-card .finishart img{filter:none!important}
#view-card .study{background:#fff}

}


/* ---- заливка этапов, цвета заданы вручную ---- */
#view-card .sthead{transition:background 140ms ease-out}
#view-card .sthead.st1{background:#FFD54F;border-color:#FFD54F}
#view-card .sthead.st2{background:#6B7A75;border-color:#6B7A75}
#view-card .sthead.st3{background:#1C2622;border-color:#1C2622}
#view-card .sthead.st1 .sttl b,#view-card .sthead.st1 .snum,#view-card .sthead.st1 .chev{color:#1C2622}
#view-card .sthead.st1 .stcnt{color:#1C2622;background:rgba(255,255,255,.55)}
#view-card .sthead.st1 .snum{background:rgba(255,255,255,.55)}
#view-card .sthead.st2 .sttl b,#view-card .sthead.st3 .sttl b,
#view-card .sthead.st2 .chev,#view-card .sthead.st3 .chev{color:#fff}
#view-card .sthead.st2 .snum,#view-card .sthead.st3 .snum{background:rgba(255,255,255,.18);color:#fff}
#view-card .sthead.st2 .stcnt,#view-card .sthead.st3 .stcnt{color:#fff;background:rgba(255,255,255,.16)}
#view-card .sthead.st2 .stcnt.full,#view-card .sthead.st3 .stcnt.full{color:#FFD54F}
/* заголовок карты — тёмный teal, как договаривались */
#view-card h1{color:#2C5748}
#view-card h1 em{color:#43836D}
/* служебные элементы, которых не было в исходнике */
#view-card .topright{display:flex;justify-content:flex-end;margin-top:18px}
#view-card .banner{margin-top:22px;border-radius:18px;overflow:hidden;background:#EAF3F8}
#view-card .banner img{display:block;width:100%;height:auto}
#view-card .status{font:600 12px var(--font-body);color:var(--muted);border:1px solid var(--hairline);
  background:var(--paper);border-radius:20px;padding:6px 12px;white-space:nowrap}
#view-card .status.save{color:var(--brand)}
#view-card .status.err{color:#8d4a41;border-color:#E6CCC7;background:#FDF7F6}
#view-card .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
#view-card .asadmin{margin-top:16px;font-size:12.5px;background:var(--paper);border:1px solid var(--hairline);
  border-left:3px solid #FFD54F;border-radius:14px;padding:10px 14px}
#view-card .spacer{flex:1}

/* ---- выравнивание по центру страницы ----
   исходный CSS содержал body{margin:0}, из-за скоупа он превратился в
   #view-card{margin:0} и отменял центрирование колонки */
#view-card{max-width:1080px;margin:0 auto;padding:34px 22px 140px}

/* ---- шрифты брендбука, размеры прежние ---- */
#view-card{--font-display:'Ubuntu','Verdana',sans-serif;--font-body:'Open Sans','Arial',sans-serif}

/* ---- заголовок карты: приставка приглушена, имя главное ----
   Чтобы поменять местами акценты, замените два цвета ниже:
     имя фирменным зелёным            → h1{color:#2C5748}  h1 em{color:#43836D}
     имя жёлтым на тёмной плашке      → h1 em{color:#FFD54F;background:#1C2622;padding:0 10px}
     имя максимально контрастным      → h1 em{color:#1C2622}                                   */
#view-card h1{color:#6B7A75}
#view-card h1 em{font-style:normal;color:#2C5748}

/* ---- прямые углы: размеры и отступы не меняются ---- */
#view-card .card,#view-card .card-plate,#view-card .sthead,#view-card .bar,#view-card .hbadge,
#view-card .banner,#view-card .chip,#view-card .fmt,#view-card .lnk,#view-card .note,#view-card .plan,
#view-card .tab-btn,#view-card .pwrap,#view-card .pbar,#view-card .btn,#view-card .f input,
#view-card .rc,#view-card .dur,#view-card .qrow,#view-card .sc,#view-card .cmt,#view-card textarea,
#view-card .status,#view-card .asadmin,#view-card .finish,#view-card .finishart img,#view-card .study,
#view-card .fb,#view-card .fbhead,#view-card .pbtn,#view-card .blk h3,#view-card .grp,#view-card .stcnt,
#view-card .snum,#view-card .cb,#view-card .trav,#view-card .stnote,#view-card .daybar b,
#view-card .sendbox,#view-card .skeleton{border-radius:0}
/* круглыми остаются только узлы тропы и котёнок — это графика, а не блоки */
#view-card .node{border-radius:50%}
#view-card .walker img{border-radius:50%}

/* вводные абзацы на вкладках — во всю ширину колонки,
   ограничение в 60 знаков нужно стартовой странице, а не карте */
#view-card .lead,#view-card .study .lead,#view-card .fb .lead{max-width:none}

/* заголовок анкеты крупнее: подзаголовок убран, вес держит он один */
#view-card .card-plate h2{font-size:22px;line-height:1.2;margin:2px 0 16px}

/* просроченная плановая дата обратной связи */
#view-card .plan.late{color:#93372C;background:#FBF3F1;border-left:3px solid #B4483C}
</style>
</head>

   Чтобы у каждого была своя карта на одном компьютере, поменяйте КЛЮЧ. */

/* ======================  связь с сервером  ======================
   Вставьте сюда адрес развёрнутого веб-приложения Apps Script (…/exec) —
   инструкция в файле Маршрутные-карты.gs. Пока строка пустая, карта
   работает как раньше: только локально, в таблицу ничего не уходит. */
const NEW_SEND_URL = "https://script.google.com/macros/s/AKfycbwIIsshsOxBEcFcJ4ZRCPW5NB1KEGzi9Vp_ZZYSkJkuqqtUihgkNSPKSNxd1iO7fX6lBg/exec";

const hash = s => { let h = 5381; for(let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return h.toString(36); };
const strip = s => String(s).replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
const слово = (n, f) => { const a = Math.abs(n) % 100, b = a % 10;
  return a > 10 && a < 20 ? f[2] : b > 1 && b < 5 ? f[1] : b === 1 ? f[0] : f[2]; };
const CHECK = '<svg viewBox="0 0 12 12"><path d="M2 6.3 L4.6 8.9 L10 3.1" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';

let ПОЧТА = '', ПРАВА = 'талант';
let ОТМЕТКИ = {}, АНКЕТА = {}, очередь = {}, таймер = null, шлём = false, анкетаГрязна = false;
const есть = id => ОТМЕТКИ[id] === true || ОТМЕТКИ[id] === 'да';
const знач = id => (ОТМЕТКИ[id] === undefined || ОТМЕТКИ[id] === true) ? '' : String(ОТМЕТКИ[id]);

function статус(текст, кл){ const s = $('#status'); s.textContent = текст; s.className = 'status' + (кл ? ' ' + кл : ''); }

function пометить(id, v){
  if(v === false || v === '' || v === null || v === undefined){ delete ОТМЕТКИ[id]; очередь[id] = false; }
  else { ОТМЕТКИ[id] = v; очередь[id] = v; }
  план();
}
function план(){
  clearTimeout(таймер);
  статус('есть несохранённое', 'err');
  таймер = setTimeout(отправить, 1200);
}
function отправить(){
  if(!Object.keys(очередь).length && !анкетаГрязна) return;
  очередь = {}; анкетаГрязна = false;
  ХРАНИЛИЩЕ.set(КЛЮЧ + '::отметки', JSON.stringify(ОТМЕТКИ));
  ХРАНИЛИЩЕ.set(КЛЮЧ + '::анкета', JSON.stringify(АНКЕТА));
  статус('сохранено ' + new Date().toLocaleTimeString('ru-RU').slice(0,5));
  отправитьНаСервер();
}

/* Скрытый iframe с form POST — работает и с file://, и без CORS, но не даёт
   прочитать ответ сервера напрямую. Поэтому это «по-честному молчаливая»
   отправка: не блокирует ввод и не требует кнопки, но и не спорит с
   пользователем, если сеть подвела — просто попробует снова на следующей
   отметке. Список карт (route-maps.html) — вот где реально видно, дошло или нет. */
function отправитьНаСервер(){
  if(!NEW_SEND_URL) return;
  const фио = (АНКЕТА.фио || '').trim();
  if(!фио){ шлём = false; return; }

  const с = сводка();
  const payload = {
    kind: 'progress',
    фио: фио,
    профиль: {
      роль: АНКЕТА.роль || '', наставник: АНКЕТА.наставник || '', принят: АНКЕТА.принят || '',
      рождение: АНКЕТА.рождение || '', телефон: АНКЕТА.телефон || '', оплата: АНКЕТА.оплата || ''
    },
    mail: ПОЧТА || '',
    pct: с.pct, готово: с.готово, всего: с.всего,
    учГот: с.учГот, учВсе: с.учВсе, шаг: с.шаг, балл: с.балл || ''
  };

  шлём = true;
  const frame = document.createElement('iframe');
  frame.name = 'iteal-rm-' + Date.now();
  frame.style.display = 'none';
  document.body.appendChild(frame);
  const form = document.createElement('form');
  form.method = 'POST'; form.action = NEW_SEND_URL; form.target = frame.name; form.style.display = 'none';
  const inp = document.createElement('input');
  inp.type = 'hidden'; inp.name = 'payload'; inp.value = JSON.stringify(payload);
  form.appendChild(inp);
  document.body.appendChild(form);

  const finish = (ок) => {
    шлём = false;
    form.remove(); setTimeout(() => frame.remove(), 1500);
    статус(ок ? 'сохранено и отправлено ' + new Date().toLocaleTimeString('ru-RU').slice(0,5)
              : 'сохранено локально, отправка не удалась — повторим на следующей отметке', ок ? '' : 'err');
  };
  const timer = setTimeout(() => finish(false), 15000);
  setTimeout(() => {
    frame.addEventListener('load', () => { clearTimeout(timer); finish(true); }, { once:true });
    try { form.submit(); } catch(e){ clearTimeout(timer); finish(false); }
  }, 60);
}

window.addEventListener('beforeunload', e => {
  if(Object.keys(очередь).length || шлём){ e.preventDefault(); e.returnValue = ''; }
});

/* ======================  вспомогательное  ====================== */
function рабДень(iso, n){
  if(!iso) return null;
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return null;
  let л = n;
  while(л > 0){ d.setDate(d.getDate() + 1); const w = d.getDay(); if(w !== 0 && w !== 6) л--; }
  return d;
}
const дд = d => d ? String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + d.getFullYear() : '';

const пк = () => (FB.periods.filter(p => p.t === ПЕРИОД)[0] || FB.periods[0]).k;
const fid = (k) => 'fb::' + k;

  const w = document.createElement('div');
  w.className = 'walker'; w.id = 'walker';

  $('#finish').innerHTML = (КАРТИНКИ.tree ? '<div class="finishart"><img id="treeimg" alt=""></div>' : '') +
    '<div class="fcap">' + DATA.finish.cap + '</div><div class="fsub">' + DATA.finish.sub + '</div>';

/* ======================  сводка и пересчёт  ====================== */
function сводкаОС(){
  let периодов = 0, посл = '', балл = '', enps = '';
  FB.periods.forEach(p => {
    const оценки = [];
    let занято = false;
    FB.scale.groups.forEach(g => g.items.forEach(it => {
      const v = знач(fid(p.k + '::s' + it.n));
      if(v){ оценки.push(+v); занято = true; }
      if(знач(fid(p.k + '::c::s' + it.n))) занято = true;
    }));
    FB.open.items.forEach(it => { if(знач(fid(p.k + '::o' + it.n))) занято = true; });
    const e = знач(fid(p.k + '::enps'));
    if(e || знач(fid(p.k + '::c::enps'))) занято = true;
    if(занято){
      периодов++; посл = p.t; enps = e;
      балл = оценки.length ? Math.round(оценки.reduce((a, b) => a + b, 0) / оценки.length * 10) / 10 : '';
    }
  });
  return { периодов, посл, балл, enps };
}
function сводка(){
  const по = DATA.stages.map(() => 0);
  let готово = 0;
  шаги.forEach(s => { if(есть(s.id)){ готово++; по[s.si]++; } });
  const ос = сводкаОС();
  const планы = {};
  шаги.forEach(s => { if(s.days){ const d = рабДень(АНКЕТА.принят, s.days); if(d) планы[s.days] = дд(d); } });
  const первый = шаги.filter(s => !есть(s.id))[0];
  return {
    pct: шаги.length ? Math.round(готово / шаги.length * 100) : 0,
    готово, всего: шаги.length,
    этапы: DATA.stages.map((st, i) => по[i] + ' / ' + st.groups.reduce((a, g) => a + g.items.length, 0)),
    учГот: учёба.filter(r => есть(r.id)).length, учВсе: учёба.length,
    шаг: первый ? 'ЭТАП ' + первый.stageNum + (первый.group ? ' · ' + первый.group.split('·')[0].trim() : '') + ' · № ' + первый.num
               : 'маршрут пройден',
    планы, периодыОС: ос.периодов, балл: ос.балл, enps: ос.enps, последний: ос.посл
  };
}

function обновить(){
  const по = DATA.stages.map(() => 0);
  let готово = 0, первый = -1;
  шаги.forEach((s, i) => {
    const d = есть(s.id);
    if(d){ готово++; по[s.si]++; } else if(первый < 0) первый = i;
    s.card.classList.toggle('done', d);
    s.card.setAttribute('aria-checked', d ? 'true' : 'false');
    s.node.classList.toggle('done', d);
    s.spine.classList.toggle('done', d);
    if(s.days){
      const el = s.card.querySelector('.plan');
      const dt = рабДень(АНКЕТА.принят, s.days);
      const позже = dt && !d && dt < new Date();
      el.textContent = dt ? 'Плановая дата: ' + дд(dt) + ' (' + s.days + ' раб. дн. от даты приёма)'
                          : 'Плановая дата: укажи дату приёма в анкете';
      el.classList.toggle('late', !!позже);
      if(позже) el.textContent += ' — просрочено';
    }
  });
  DATA.stages.forEach((st, i) => {
    const el = document.querySelector('.stcnt[data-c="' + i + '"]');
    const всего = st.groups.reduce((a, g) => a + g.items.length, 0);
    el.textContent = по[i] + ' / ' + всего;
    el.classList.toggle('full', по[i] === всего);
  });

  const pct = шаги.length ? Math.round(готово / шаги.length * 100) : 0;
  $('#pct').textContent = pct + '%';
  $('#fill').style.width = pct + '%';
  $('#pnote').textContent = 'отмечено ' + готово + ' из ' + шаги.length + ' ' + слово(шаги.length, ['шага','шагов','шагов']);
  let поз = 0;
  по.forEach((c, i) => { if(c > 0) поз = i; });
  $('#stagenow').textContent = готово === шаги.length && шаги.length ? 'маршрут пройден' : 'этап ' + (поз + 1) + ' из ' + DATA.stages.length;
  $('#finish').classList.toggle('on', готово === шаги.length && шаги.length > 0);
  const дер = $('#treeimg');
  if(дер && !дер.src) window.картинку(дер, 'tree');

  const уч = учёба.filter(r => есть(r.id)).length;
  учёба.forEach(r => { r.el.classList.toggle('done', есть(r.id)); r.el.setAttribute('aria-checked', есть(r.id) ? 'true' : 'false'); });
  $('#c-map').textContent = готово + '/' + шаги.length;
  $('#c-study').textContent = уч + '/' + учёба.length;

  окно = первый;
  маркер();
}

let окно = 0;
function маркер(){
  const w = $('#walker');
  if(!w) return;
  const s = шаги[окно];
  const цель = s && s.node.getClientRects().length ? s.node : (s ? s.sec.querySelector('.snum') : null);
  if(!цель){ w.style.display = 'none'; return; }
  w.style.display = 'block';
  const t = $('#trail').getBoundingClientRect(), r = цель.getBoundingClientRect();
  w.style.left = (r.left - t.left + r.width / 2) + 'px';
  w.style.top = (r.top - t.top + r.height / 2) + 'px';
}

/* ======================  анкета и вкладки  ====================== */
const ПОЛЯ = ['фио','роль','наставник','принят','рождение','телефон','оплата'];
function анкетуВПоля(){ ПОЛЯ.forEach(f => { $('#' + f).value = АНКЕТА[f] || ''; }); }
function анкетуСПолей(){
  ПОЛЯ.forEach(f => { АНКЕТА[f] = $('#' + f).value.trim(); });
  анкетаГрязна = true;
  план(); обновить();
}
function вкладка(имя){
  $$('.tab[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === имя));
  $$('.panel').forEach(p => p.classList.toggle('on', p.id === 'panel-' + имя));
  if(имя === 'map') requestAnimationFrame(маркер);
}

/* ======================  старт  ====================== */
function открытьКарту(){
  try { ОТМЕТКИ = JSON.parse(ХРАНИЛИЩЕ.get(КЛЮЧ + '::отметки') || '{}'); } catch(e){ ОТМЕТКИ = {}; }
  try { АНКЕТА = JSON.parse(ХРАНИЛИЩЕ.get(КЛЮЧ + '::анкета') || '{}'); } catch(e){ АНКЕТА = {}; }
  // Ссылка на карту приходит с уже заполненными данными (их вписал Искатель
  // талантов при создании) — подставляем то, чего ещё нет в сохранённой анкете.
  ПОЛЯ.forEach(f => { const v = ПАРАМЕТРЫ.get(f); if(v && !АНКЕТА[f]) АНКЕТА[f] = v; });
  if(!АНКЕТА.фио && ФИО_ИЗ_ССЫЛКИ) АНКЕТА.фио = ФИО_ИЗ_ССЫЛКИ;
  ПОЧТА = ПОЧТА_ИЗ_ССЫЛКИ || ПОЧТА;
  $('#h1').innerHTML = 'Маршрутная карта' + (АНКЕТА.фио ? ' · <em>' + эк(АНКЕТА.фио) + '</em>' : '');
  $('#lead').textContent = 'Отмечай сделанное — тропа за тобой загорается, а прогресс остаётся в этом браузере.';
  $('#anketa').hidden = false;
  window.картинку($('#cardbannerimg'), КАРТИНКИ.card ? 'card' : 'hero');
  анкетуВПоля();
  строим(); самообучение(); обратная(); читаемОС(); обновить();
  статус(NEW_SEND_URL ? 'прогресс сохраняется и отправляется автоматически' : 'прогресс сохраняется в этом браузере');
  $('#foot').textContent = 'Отметки сохраняются в этом браузере и автоматически отправляются в таблицу «Маршрутные карты».';
}

$$('.tab[data-tab]').forEach(b => b.addEventListener('click', () => вкладка(b.dataset.tab)));
ПОЛЯ.forEach(f => {
  $('#' + f).addEventListener('change', анкетуСПолей);
  $('#' + f).addEventListener('blur', анкетуСПолей);
});
let т; window.addEventListener('resize', () => { clearTimeout(т); т = setTimeout(маркер, 120); });
window.addEventListener('scroll', маркер, { passive: true });


window.картинку = (el, ключ) => { if(el && КАРТИНКИ[ключ]) el.src = КАРТИНКИ[ключ]; };
открытьКарту();
})();
</script>
