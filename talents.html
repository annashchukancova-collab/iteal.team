var DOMAINS = [
    { id: "execution", name: "Исполнение", desc: "Как человек доводит дела до результата: дисциплина, качество, надёжность.", color: "#4a3aa7" },

  // long — расширенное описание темы для PDF-отчёта (2-3 предложения от

  // не используются — там короткого def достаточно.
  var THEMES = [
    { id: "finisher",     domain: "execution", name: "Доводчик",        def: "Не может оставить начатое незакрытым, доводит любое дело до финальной точки.",
      long: "Ты редко бросаешь дело на середине. Даже когда задача превращается в рутину, тебе важно довести её до финальной точки — не потому что кто-то проверяет, а потому что незакрытое дело физически мешает переключиться на следующее. Именно поэтому тебе часто поручают то, что другие не дожали.",
      unique: "Обратная сторона — тебе тяжело официально признать проект мёртвым и просто отпустить его: незакрытая задача цепляет сильнее, чем разумные доводы «пора остановиться». Иногда полезнее спросить себя не «как это доделать», а «а точно ли стоит».",
      tip: "Возьми на себя роль того, кто закрывает последний этап проекта — там, где чужая энергия уже кончилась, твоя как раз включается." },
    { id: "organizer",    domain: "execution", name: "Собранность",     def: "Раскладывает хаос задач по полочкам и находит нужные ресурсы под план.",
      long: "Там, где другие видят хаос из десятков разрозненных задач, ты почти сразу видишь план: что делать сначала, какие ресурсы понадобятся, кого подключить. Это не про жёсткие таблицы — это про внутреннее чутьё на структуру.",
      unique: "Есть и цена: чужой хаос иногда раздражает тебя сильнее, чем того заслуживает, а желание разложить всё по полочкам может душить людей, которым удобнее работать спонтанно. Не всякую ситуацию нужно упорядочивать — порой лучше дать ей идти своим чередом.",
      tip: "Бери на себя запуск новых процессов и проектов на старте — момент, когда порядка ещё нет, для тебя самый комфортный." },
    { id: "discipline",   domain: "execution", name: "Дисциплина",      def: "Любит порядок, рутину и предсказуемые процессы, от них становится только лучше.",
      long: "Тебе не нужно бороться с собой, чтобы работать по графику — предсказуемый процесс сам по себе даёт энергию, а не отнимает её. Рутина освобождает внимание для по-настоящему важных решений, а не притупляет его.",
      unique: "Слепое пятно здесь такое: когда правила игры вдруг резко меняются, тебе нужно чуть больше времени на перестройку, чем прирождённым импровизаторам. Стоит замечать момент, когда порядок уже мешает, а не помогает.",
      tip: "Возьми на себя настройку регулярных процессов в команде — там, где нужна не разовая инициатива, а стабильность неделя за неделей." },
    { id: "ownership",    domain: "execution", name: "Ответственность", def: "Берёт на себя обязательства и держит слово, даже когда это стало неудобно.",
      long: "Слово, которое ты дал, весит для тебя больше, чем изменившиеся обстоятельства. Люди вокруг быстро считывают это и начинают опираться на тебя без напоминаний и подстраховки — просто потому что знают: если ты взял, значит сделаешь.",
      unique: "Издержка в том, что ты склонен(на) набирать больше обязательств, чем реально способен(на) унести, — отказать кому-то на входе кажется почти невозможным. Честное «нет» заранее иногда полезнее, чем героическое исполнение на пределе сил.",
      tip: "Явно проговаривай, что именно ты берёшь на себя в проекте — команде важно видеть эту опору, а не догадываться о ней." },
    { id: "precision",    domain: "execution", name: "Точность",        def: "Замечает детали, несоответствия и ошибки там, где другие проходят мимо.",

      tip: "Возьми на себя финальную проверку перед отправкой клиенту или публикацией — свежий, не замыленный взгляд именно на детали, это твоя территория." },
    { id: "momentum",     domain: "execution", name: "Скорость",        def: "Предпочитает действовать быстро и пробовать, а не долго готовиться.",

      unique: "Риск в том, что действие иногда обгоняет анализ: часть ошибок, которые вдумчивая подготовка бы отловила, всплывают уже по ходу дела. Не каждая задача выигрывает от немедленного старта — есть и такие, где спешка дорого обходится.",
      tip: "Бери на себя первый черновой прогон нового процесса или гипотезы — твоя скорость превращает абстрактный план в проверяемый факт." },
    { id: "endurance",    domain: "execution", name: "Выносливость",    def: "Способен долго и стабильно работать без падения качества.",

      unique: "Плата за это — ты не всегда вовремя замечаешь собственную усталость: способность тянуть долго маскирует сигналы, что пора остановиться и восстановиться. Команда, привыкшая на тебя рассчитывать, тоже редко замечает, чего это тебе стоит.",
      tip: "Берись за проекты с долгим циклом и отложенным результатом — там, где нужно ровно тянуть месяцами, а не только красиво стартовать." },
    { id: "efficiency",   domain: "execution", name: "Экономность",     def: "Ищет способ получить тот же результат с меньшими затратами ресурсов.",
      long: "Ты почти рефлекторно замечаешь лишний шаг в процессе и хочешь его убрать. Не потому что лень, а потому что тратить ресурс там, где можно не тратить, кажется тебе неправильным по существу.",
      unique: "Есть нюанс: иногда ты оптимизируешь даже то, что вовсе не нуждалось в оптимизации, — «лишний» ритуал порой выполняет важную социальную функцию, которую холодный расчёт эффективности не всегда улавливает.",
      tip: "Регулярно пересматривай устоявшиеся процессы команды на предмет лишних шагов — свежий взгляд на «так было всегда» именно твоя сильная сторона." },
    { id: "troubleshoot", domain: "execution", name: "Восстановление",  def: "Включается именно там, где что-то сломалось, и получает удовольствие от исправления.",
      long: "Там, где что-то сломалось и все растерялись, ты, наоборот, включаешься. Разбирать поломку и чинить то, что все уже списали, приносит тебе больше удовлетворения, чем строить что-то с нуля на пустом месте.",
      unique: "Другая сторона медали — то, что и так исправно работает, интересует тебя заметно меньше: профилактика и поддержание стабильности могут казаться скучнее, чем они того на самом деле заслуживают.",
      tip: "Проси задачи из категории «это все считают безнадёжным» — именно там твой профиль раскрывается сильнее всего." },

    { id: "initiator",  domain: "influence", name: "Инициативность",    def: "Первым начинает действовать и своим примером подталкивает остальных.",

      unique: "Стоит учитывать: твой первый шаг иногда опережает готовность остальных — ты уже в деле, а часть команды ещё не успела мысленно согласиться с направлением и остаётся в недоумении.",
      tip: "Бери на себя старт новых инициатив там, где команда застряла в раздумьях — твой первый шаг обычно снимает коллективный ступор." },
    { id: "persuader",  domain: "influence", name: "Убедительность",    def: "Строит аргументацию так, что с ней соглашаются даже скептики.",
      long: "Ты умеешь находить именно те аргументы, которые снимают возражения собеседника, а не просто повторяешь свою позицию громче. В переговорах решение чаще склоняется в твою сторону, потому что ты слышишь, что на самом деле важно оппоненту.",
      unique: "Ловушка здесь такая: убедить — не всегда значит оказаться правым. Твой дар аргументации иногда побеждает даже там, где стоило бы притормозить и повнимательнее прислушаться к чужому сомнению.",
      tip: "Бери на себя переговоры в спорных ситуациях с клиентом или командой — там, где нужно убедить, а не продавить." },
    { id: "competitor", domain: "influence", name: "Соревновательность", def: "Заряжается сравнением с другими и стремлением быть первым.",

      unique: "Обратная сторона — азарт сравнения иногда превращает совместную задачу в скрытое соперничество там, где нужнее было бы просто договориться. Не каждая ситуация требует победителя.",
      tip: "Превращай задачи в измеримое сравнение — свой прошлый результат, конкурента, лучший показатель команды — так твоя энергия включается сама." },
    { id: "selfbelief", domain: "influence", name: "Уверенность в себе", def: "Доверяет собственным решениям без необходимости внешнего подтверждения.",
      long: "Тебе не требуется внешнее одобрение, чтобы двигаться дальше со своим решением. Внутреннее чувство правильности курса весит для тебя больше, чем сомнения со стороны, — это даёт устойчивость там, где другие откатываются назад.",

    { id: "relator",   domain: "relations", name: "Близость",      def: "Предпочитает несколько глубоких отношений большому кругу поверхностных знакомств.",

  /* =========================================================
     2. НАСТРОЙКИ
     ========================================================= */

  // Сколько раундов round-robin брать в тест. Каждый раунд = каждая
  // тема встречается ровно 1 раз с новым соперником. ROUNDS раундов =>
  // у каждой темы ROUNDS появлений => (ROUNDS * 34 / 2) вопросов всего.
  // 8 раундов = 136 вопросов, ~15-20 минут. Увеличивайте для точности
  // ранжирования, уменьшайте для более короткого прохождения.
  

var ROUNDS = 8;

  // URL вебхука, куда отправлять результаты (Google Apps Script /
  // Make.com / Zapier catch hook). Пусто = результат остаётся только
  // локально у кандидата (скачать/скопировать). Общий для всех вкладок —
  // payload.kind различает "talents", "iq" и "case". См. README.md.
  

function buildSchedule(n, rounds) {
    var m = n - 1;
    var schedule = [];
    for (var r = 0; r < rounds; r++) {
      var roundPairs = [];
      for (var i = 0; i < n / 2; i++) {
        var home, away;
        if (i === 0) {
          home = r % m;
          away = n - 1;
        } else {
          home = (r + i) % m;
          away = ((m - i + r) % m + m) % m;
        }
        roundPairs.push([home, away]);
      }
      schedule.push(roundPairs);
    }
    return schedule;
  }

  function buildQuestions() {
    var n = THEMES.length;
    var schedule = buildSchedule(n, ROUNDS);
    var questions = [];
    for (var r = 0; r < schedule.length; r++) {
      schedule[r].forEach(function (pair) {
        var themeA = THEMES[pair[0]];
        var themeB = THEMES[pair[1]];
        var variant = r % 3;
        var swap = Math.random() < 0.5;
        var left = swap ? themeB : themeA;
        var right = swap ? themeA : themeB;
        questions.push({
          leftId: left.id,
          rightId: right.id,
          leftText: STATEMENTS[left.id][variant],
          rightText: STATEMENTS[right.id][variant]
        });
      });
    }
    // перемешать порядок предъявления (Fisher-Yates)
    for (var i = questions.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = questions[i]; questions[i] = questions[j]; questions[j] = tmp;
    }
    return questions;
  }

  /* Состояние опросника — только для этой страницы. ФИО/email теперь
     общие для всего сайта и живут в localStorage (см. shared.js,
     requireProfile()), а не здесь. */


function computeResults() {
    var ranked = THEMES.map(function (t) {
      var score = state.scores[t.id] || 0;
      return {
        theme: t,
        score: score,
        pct: Math.round((score / ROUNDS) * 100)
      };
    });
    // сортировка по убыванию % (при равенстве — исходный порядок, стабильно)
    ranked.sort(function (a, b) { return b.pct - a.pct; });

    var domainScores = DOMAINS.map(function (d) {
      var themesInDomain = ranked.filter(function (r) { return r.theme.domain === d.id; });
      var avg = themesInDomain.reduce(function (s, r) { return s + r.pct; }, 0) / themesInDomain.length;
      return { domain: d, pct: Math.round(avg) };
    });

    return { ranked: ranked, domainScores: domainScores };
  }

  
function overviewHtml() {
    var domainsHtml = DOMAINS.map(function (d) {
      var themesInDomain = THEMES.filter(function (t) { return t.domain === d.id; });

            '<span class="talent-name">' + t.name + '</span>' +

      }).join("");
      return '<div class="domain-col" style="border-left-color:' + d.color + '">' +
        '<h2 style="color:' + d.color + '">' + d.name + '</h2>' +
        '<p class="domain-desc">' + d.desc + '</p>' +

    }).join("");

    return '<span class="kicker">все 34 таланта</span>' +

      '<p class="lead">Прочитай заранее, что тест вообще измеряет, — и переходи к вопросам, когда будешь готов(а).</p>' +

    var t = state;

    t.index += 1;

      t.screen = "results";
      t.lastResults = computeResults();
      sendTalentsWebhook(t.lastResults);
    }

function talentsPayload(results) {
    return {
      kind: "talents",
      name: profile.name,
      email: profile.email,
      rounds: ROUNDS,
      top5: results.ranked.slice(0, 5).map(function (r) { return { id: r.theme.id, name: r.theme.name, pct: r.pct }; }),
      full: results.ranked.map(function (r) { return { id: r.theme.id, name: r.theme.name, pct: r.pct }; }),
      domains: results.domainScores.map(function (d) { return { id: d.domain.id, name: d.domain.name, pct: d.pct }; })
    };
  }

  function sendTalentsWebhook(results) {
    if (!WEBHOOK_URL) return;
    try {
      fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(talentsPayload(results))
      }).catch(function () { /* нет сети/CORS — результат всё равно виден кандидату */ });
    } catch (e) { /* игнорируем: локальный отчёт важнее сетевой отправки */ }
  }

  /* Единый генератор HTML отчёта — рендерится прямо на экране результатов
     и печатается оттуда же (Ctrl+P / кнопка «Печать») через @media print,
     поэтому экран и PDF гарантированно выглядят одинаково. Без сравнения
     с прошлым прохождением (данных для сравнения нет — это разовый
     снимок) и без фото — только то, что реально есть у нас: 34 темы,
     4 домена, топ-5 с описанием. */
  // Короткая фраза-синтез для пары тем из топ-5: не готовый текст на
  // каждую из C(34,2) = 561 возможных пар (это нереально поддерживать
  // вручную), а склейка их же коротких def на лету. Работает для любой
  // пары, ничего заранее прописывать не нужно.
  // Описание темы-"якоря" (a) уже дано в основном абзаце разбора — здесь
  // повторять его не нужно, важно только то, что добавляется в сочетании.
  // Коннектор варьируется по seed, чтобы 4 строки combos в одном finding
  // и 20 строк по всему отчёту не звучали как один и тот же шаблон.
  var COMBINE_CONNECTORS = [
    "к этому добавляется то, что",
    "рядом с этим хорошо работает то, что",
    "усиливает эту связку то, что",
    "плюс к этому",
    "не менее важно здесь то, что",
    "в паре с этим раскрывается то, что",
    "добавляет глубины то, что",
    "к тому же",
    "здесь же стоит учитывать, что",
    "в тандеме с этим проявляется то, что"
  ];
  
function combineLine(a, b, seed) {
    function lowerFirst(s) { return s.charAt(0).toLowerCase() + s.slice(1); }
    var connector = COMBINE_CONNECTORS[seed % COMBINE_CONNECTORS.length];
    return '<p><strong>«' + a.name + '» + «' + b.name + '»</strong> — ' + connector + ' ' +
      lowerFirst(b.def) + '</p>';
  }

  function buildReportHtml(results) {
    var ranked = results.ranked;
    var top5 = ranked.slice(0, 5);
    var top5Ids = {};
    top5.forEach(function (r) { top5Ids[r.theme.id] = true; });
    var topDomain = results.domainScores.slice().sort(function (a, b) { return b.pct - a.pct; })[0];
    var totalQuestions = ranked.length * ROUNDS / 2;
    var dateStr = new Date().toLocaleDateString("ru-RU", { day: "2-digit", month: "long", year: "numeric" });

    var ranksHtml = ranked.map(function (r, i) {
      var isTop = !!top5Ids[r.theme.id];
      return '<div class="row' + (isTop ? ' top' : '') + '">' +
        '<div class="r">' + (i + 1) + '</div>' +
        '<div class="nm">' + r.theme.name + '</div>' +
        '<div class="track"><b style="width:' + Math.max(r.pct, 1.5) + '%"></b></div>' +
        '<div class="v">' + r.pct + '%</div>' +
      '</div>';
    }).join("");

    var tilesHtml = results.domainScores.slice().sort(function (a, b) { return b.pct - a.pct; }).map(function (d) {
      var inTop = top5.filter(function (r) { return r.theme.domain === d.domain.id; }).map(function (r) { return r.theme.name; });
      var note = inTop.length ? ("В топ-5: " + inTop.join(", ") + ".") : d.domain.desc;
      return '<div class="tile">' +
        '<div class="lbl">' + escapeHtml(d.domain.name) + '</div>' +
        '<div class="val">' + d.pct + '%</div>' +
        '<div class="meter"><b style="width:' + d.pct + '%"></b></div>' +
        '<p class="note">' + note + '</p>' +
      '</div>';
    }).join("");

    var topListHtml = top5.map(function (r, i) {
      var d = DOMAINS.filter(function (dm) { return dm.id === r.theme.domain; })[0];
      return '<div class="top-item" style="border-left-color:' + d.color + '">' +
        '<div class="top-item-head">' +
          '<span class="top-item-rank">' + (i + 1) + '</span>' +
          '<span class="top-item-name">' + r.theme.name + '</span>' +
          '<span class="top-item-pct">' + r.pct + '%</span>' +
        '</div>' +
        '<p class="top-item-def">' + r.theme.def + '</p>' +
      '</div>';
    }).join("");

    var findingsHtml = top5.map(function (r, i) {
      var d = DOMAINS.filter(function (dm) { return dm.id === r.theme.domain; })[0];
      var others = top5.filter(function (o) { return o.theme.id !== r.theme.id; });
      var combosHtml = others.map(function (o, j) { return combineLine(r.theme, o.theme, i * 4 + j); }).join("");
      return '<div class="finding" style="border-left-color:' + d.color + '">' +
        '<div class="mark"><span style="background:' + d.color + '">' + escapeHtml(d.name) + '</span></div>' +
        '<p><strong>' + r.theme.name + ' — ' + r.pct + '%.</strong> ' + r.theme.long + '</p>' +
        '<p class="sub-label">Обратная сторона медали</p>' +
        '<p>' + r.theme.unique + '</p>' +
        '<p class="sub-label">Сочетается с другими сильными сторонами из топ-5</p>' +
        '<div class="combos">' + combosHtml + '</div>' +
        '<p class="sub-label">Как использовать</p>' +
        '<p>' + r.theme.tip + '</p>' +
      '</div>';
    }).join("");

    return '<div class="report">' +
        '<div class="brandbar">' +
          '<img src="' + LOGO_SRC + '" alt="iTeal">' +
          '<span class="stamp">Профиль талантов · ' + dateStr + '</span>' +
        '</div>' +
        '<header>' +
          '<span class="eyebrow">Профиль талантов · ' + escapeHtml(profile.name) + ' · ' + dateStr + '</span>' +
          '<h1>«' + ranked[0].theme.name + '» — твоя ведущая тема</h1>' +
          '<p class="lede">Тест на 34 темы, форс-выбор в ' + totalQuestions + ' парах. Каждая тема получила балл — ' +
          'долю раундов, в которых побеждала у случайного соперника. Ниже — полный профиль и разбор пяти ведущих тем.</p>' +
          '<div class="score">' +
            '<div class="score-num">' + topDomain.pct + '<span>%</span></div>' +
            '<div class="score-txt"><strong>«' + escapeHtml(topDomain.domain.name) + '»</strong> — направление с ' +
            'наибольшим средним баллом. ' + topDomain.domain.desc + '</div>' +
          '</div>' +
        '</header>' +
        '<figure>' +
          '<div class="fig-head">' +
            '<p class="fig-title">5 сильных сторон</p>' +
            '<p class="fig-sub">Коротко, что означает каждая, — подробный разбор и сочетания ниже.</p>' +
          '</div>' +
          '<div class="top-list">' + topListHtml + '</div>' +
        '</figure>' +
        '<figure>' +
          '<div class="fig-head">' +
            '<p class="fig-title">Все 34 темы теста</p>' +
            '<p class="fig-sub">Ранг по нормализованному баллу, от 1 до 34.</p>' +
          '</div>' +
          '<div class="legend"><span><i class="k-top"></i>топ-5</span><span><i class="k-rest"></i>остальные темы</span></div>' +
          '<div class="ranks">' + ranksHtml + '</div>' +
          '<figcaption>Балл — доля из ' + ROUNDS + ' раундов форс-выбора, в которых утверждение темы побеждало у случайного соперника.</figcaption>' +
        '</figure>' +
        '<figure>' +
          '<div class="fig-head">' +
            '<p class="fig-title">Профиль по 4 направлениям</p>' +

    document.getElementById("btn-copy").addEventListener("click", function () { copyTalentsText(results); });
  }

  function downloadTalentsJson(results) {
    var blob = new Blob([JSON.stringify(talentsPayload(results), null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "talent-test-" + (profile.name || "anon").replace(/\s+/g, "_") + ".json";
    a.click();
    URL.revokeObjectURL(url);
  }

  function copyTalentsText(results) {
    var lines = [];
    lines.push("Тест талантов iTeal");
    lines.push(profile.name + " <" + profile.email + ">");
    lines.push("");
    lines.push("Топ-5 талантов:");
    results.ranked.slice(0, 5).forEach(function (r, i) {
      lines.push((i + 1) + ". " + r.theme.name + " (" + r.pct + "%) — " + r.theme.def);
    });
    lines.push("");
    lines.push("Профиль по направлениям:");
    results.domainScores.forEach(function (d) {
      lines.push(d.domain.name + ": " + d.pct + "%");
    });
    var text = lines.join("\n");
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text);
    }
  }

  
  var state = { screen: "overview", questions: [], index: 0, scores: {}, lastResults: null };

  function render() {
    profile = getProfile();
    var contentHtml;
    if (!profile) {
      contentHtml = gateHtml();
    } else if (state.screen === "overview") contentHtml = overviewHtml();
    else if (state.screen === "quiz") contentHtml = quizHtml();
    else contentHtml = resultsHtml();

    app.innerHTML = headerHtml() + heroImageHtml() + navHtml("talents", ["candidates"]) + contentHtml;
    bindNavDropdowns();

    if (!profile) { bindGate(render); if (window.lucide) lucide.createIcons(); return; }
    if (state.screen === "overview") bindOverview();
    else if (state.screen === "quiz") bindQuiz();
    else bindResults();

    if (window.lucide) lucide.createIcons();
  }

  render();

})();
</script>
</body>
</html>
